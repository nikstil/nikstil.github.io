<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#1f2a22">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%232e8b3a'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='40' font-family='Arial' font-weight='900' fill='white'%3EL%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6f4ee; --ink: #1d211e; --muted: #5d655f; --tile: #fff; --edge: #c9ccc6; --typed: #1d211e;
      --hit: #2e8b3a; --near: #c9a227; --miss: #6b716c; --key: #dfe2dc; --panel: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151a16; --ink: #eef1ec; --muted: #9aa49c; --tile: #1d241f; --edge: #3a443d; --typed: #c9d1cb; --miss: #3d443f; --key: #333c36; --panel: #1d241f; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; align-items: center; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; container-type: inline-size; }
    header { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--edge); }
    h1 { margin: 0; font: 900 26px/1 "Arial Black", Impact, system-ui, sans-serif; letter-spacing: 3px; }
    h1 span { color: var(--hit); }
    header .grow { flex: 1; }
    header a, header button { color: var(--ink); background: none; border: 1px solid var(--edge); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; text-decoration: none; cursor: pointer; }
    html.embed header a { display: none; }
    main { width: 100%; max-width: 520px; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 16px 16px; }
    .intro { margin: 0; text-align: center; color: var(--muted); font-size: 14px; }
    .intro b { color: var(--ink); }
    .board { display: grid; gap: 5px; --t: min(36px, calc((100cqi - 64px) / 12.5)); }
    .row { display: flex; gap: 4px; }
    .row.shake { animation: shake .4s; }
    .tile { display: grid; place-items: center; width: var(--t); height: calc(var(--t) * 1.15); font: 800 calc(var(--t) * .6)/1 system-ui, Arial, sans-serif; background: var(--tile); border: 2px solid var(--edge); border-radius: 4px; text-transform: uppercase; }
    .tile.split { margin-left: calc(var(--t) * .45); }
    .tile.typed { border-color: var(--typed); animation: pop .1s; }
    .tile.hit, .tile.near, .tile.miss { color: #fff; border-color: transparent; animation: flip .4s both; }
    .tile.hit { background: var(--hit); } .tile.near { background: var(--near); } .tile.miss { background: var(--miss); }
    .keys { display: grid; gap: 6px; width: 100%; margin-top: auto; }
    .keyrow { display: flex; gap: 5px; justify-content: center; }
    .key { flex: 0 1 42px; min-width: 0; height: 52px; padding: 0; font: 700 15px/1 system-ui, Arial, sans-serif; color: var(--ink); background: var(--key); border: 0; border-radius: 6px; cursor: pointer; touch-action: manipulation; }
    .key.wide { flex-basis: 66px; font-size: 12px; }
    .key.hit, .key.near, .key.miss { color: #fff; }
    .key.hit { background: var(--hit); } .key.near { background: var(--near); } .key.miss { background: var(--miss); }
    .end { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 14px 16px; background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; }
    .end p { margin: 0; }
    .end .big { font-size: 18px; font-weight: 800; }
    .end .win { color: var(--hit); }
    .end button { padding: 8px 16px; font: 700 14px system-ui, sans-serif; color: #fff; background: var(--hit); border: 0; border-radius: 8px; cursor: pointer; }
    .stats { display: flex; gap: 18px; color: var(--muted); font-size: 12px; }
    .stats b { display: block; font-size: 20px; color: var(--ink); }
    .toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); padding: 8px 14px; color: var(--bg); background: var(--ink); border-radius: 8px; font-weight: 700; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity .2s; }
    .toast.on { opacity: 1; }
    dialog { max-width: 360px; color: var(--ink); background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; }
    dialog::backdrop { background: rgb(0 0 0 / .4); }
    dialog .ex { display: flex; gap: 3px; margin: 6px 0; }
    dialog .ex .tile { --t: 26px; }
    @keyframes flip { from { transform: rotateX(90deg); } }
    @keyframes pop { 50% { transform: scale(1.1); } }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .tile, .row.shake { animation: none !important; } }
  </style>
</head>
<body>
  <header>
    <h1>LOG<span>GLE</span></h1>
    <span class="grow"></span>
    <button id="help-btn" aria-label="How to play">?</button>
    <a href="/">nikstil.com</a>
  </header>
  <main>
    <div class="board" id="board" role="grid" aria-label="LOGGLE board"></div>
    <div id="bottom" class="keys"></div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="help">
    <h2 style="margin-top:0">How to play</h2>
    <p>Guess the name in six tries. Twelve letters: first name, then last name.</p>
    <div class="ex"><span class="tile hit">R</span><span class="tile miss">O</span><span class="tile near">B</span></div>
    <p><b style="color:var(--hit)">Green</b>: right letter, right spot. <b style="color:var(--near)">Yellow</b>: in the name, wrong spot. <b>Grey</b>: not in it.</p>
    <p>Everyone gets the same name, and it changes at midnight.</p>
    <form method="dialog"><button style="padding:8px 16px;border-radius:8px;border:0;background:var(--hit);color:#fff;font-weight:700">Got it</button></form>
  </dialog>
  <script type="module">
    // LOGGLE, the nikstil.com edition. Same daily answer as the one in TRANSLATR™'s Arcade
    // (translatr-src/src/components/arcade/Loggle.jsx): keep answerFor() in step with it.
    if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed')

    const ANSWERS = ['ROBERTLOGGIA', 'LOBERTBOGGIA']
    const SPLIT = 6
    const LENGTH = 12
    const GUESSES = 6
    const ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM']
    const SAVE_KEY = 'loggle-save'
    const SQUARE = { hit: '🟩', near: '🟨', miss: '⬛' }
    const RANK = { miss: 1, near: 2, hit: 3 }

    const today = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
    function answerFor(day) {
      let h = 2166136261
      for (const c of `loggle:${day}`) h = Math.imul(h ^ c.charCodeAt(0), 16777619)
      h ^= h >>> 16
      h = Math.imul(h, 0x85ebca6b)
      h ^= h >>> 13
      h = Math.imul(h, 0xc2b2ae35)
      h ^= h >>> 16
      return ANSWERS[(h >>> 0) & 1]
    }
    function score(guess, answer) {
      const out = Array(LENGTH).fill('miss')
      const left = {}
      for (let i = 0; i < LENGTH; i++) {
        if (guess[i] === answer[i]) out[i] = 'hit'
        else left[answer[i]] = (left[answer[i]] ?? 0) + 1
      }
      for (let i = 0; i < LENGTH; i++) {
        if (out[i] === 'hit' || !left[guess[i]]) continue
        out[i] = 'near'
        left[guess[i]]--
      }
      return out
    }

    const load = () => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) ?? {} } catch { return {} } }
    const store = (s) => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)) } catch {} }
    let save = load()
    const day = today()
    const answer = answerFor(day)
    if (save.day !== day) save = { ...save, day, guesses: [] }
    let typed = ''
    let justPlayed = -1 // the row that should flip in

    const $ = (id) => document.getElementById(id)
    const won = () => save.guesses.at(-1) === answer
    const over = () => won() || save.guesses.length >= GUESSES

    function toast(text) {
      const t = $('toast')
      t.textContent = text
      t.classList.add('on')
      clearTimeout(toast.timer)
      toast.timer = setTimeout(() => t.classList.remove('on'), 1800)
    }

    function render() {
      const board = $('board')
      board.innerHTML = ''
      for (let r = 0; r < GUESSES; r++) {
        const word = r < save.guesses.length ? save.guesses[r] : r === save.guesses.length && !over() ? typed : ''
        const marks = r < save.guesses.length ? score(word, answer) : null
        const row = document.createElement('div')
        row.className = 'row'
        row.setAttribute('role', 'row')
        for (let i = 0; i < LENGTH; i++) {
          const t = document.createElement('span')
          t.setAttribute('role', 'gridcell')
          t.className = `tile${i === SPLIT ? ' split' : ''}${marks ? ` ${marks[i]}` : word[i] ? ' typed' : ''}`
          if (marks && r !== justPlayed) t.style.animation = 'none'
          else if (marks) t.style.animationDelay = `${i * 70}ms`
          if (!marks && i !== word.length - 1) t.style.animation = 'none'
          t.textContent = word[i] ?? ''
          t.setAttribute('aria-label', word[i] ? `${word[i]}${marks ? `, ${marks[i] === 'hit' ? 'right spot' : marks[i] === 'near' ? 'wrong spot' : 'not in it'}` : ''}` : 'empty')
          row.append(t)
        }
        board.append(row)
      }
      const bottom = $('bottom')
      bottom.innerHTML = ''
      if (over()) {
        bottom.className = 'end'
        const name = answer === ANSWERS[0] ? 'ROBERT LOGGIA' : 'LOBERT BOGGIA'
        const st = save.stats ?? {}
        bottom.innerHTML = `
          <p class="big ${won() ? 'win' : ''}">${won() ? `${name}. Got it in ${save.guesses.length}.` : `It was ${name}. There were two options.`}</p>
          <div class="stats"><span><b>${st.played ?? 0}</b>played</span><span><b>${st.wins ?? 0}</b>solved</span><span><b>${st.streak ?? 0}</b>streak</span><span><b>${st.best ?? 0}</b>best</span></div>
          <button id="share">📋 Share</button>
          <p class="intro">New name at midnight. It might be the other one.</p>`
        $('share').onclick = share
      } else {
        bottom.className = 'keys'
        const keys = {}
        for (const g of save.guesses) score(g, answer).forEach((m, i) => { if (RANK[m] > (RANK[keys[g[i]]] ?? 0)) keys[g[i]] = m })
        ROWS.forEach((row, r) => {
          const line = document.createElement('div')
          line.className = 'keyrow'
          const add = (label, key, cls = '') => {
            const b = document.createElement('button')
            b.className = `key ${cls}`
            b.textContent = label
            if (key === 'BACK') b.setAttribute('aria-label', 'Backspace')
            b.onclick = () => press(key)
            line.append(b)
          }
          if (r === 2) add('Enter', 'ENTER', 'wide')
          for (const k of row) add(k, k, keys[k] ?? '')
          if (r === 2) add('⌫', 'BACK', 'wide')
          bottom.append(line)
        })
      }
      justPlayed = -1
    }

    function submit() {
      if (typed.length < LENGTH) {
        const row = $('board').children[save.guesses.length]
        row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake')
        return toast('Not enough letters. It’s 6 + 6. You know the name.')
      }
      justPlayed = save.guesses.length
      save.guesses.push(typed)
      typed = ''
      if (over()) {
        const st = { played: 0, wins: 0, streak: 0, best: 0, ...save.stats }
        st.played++
        if (won()) {
          st.wins++
          st.streak = st.lastWin === today(new Date(Date.now() - 864e5)) ? st.streak + 1 : 1
          st.best = Math.max(st.best, st.streak)
          st.lastWin = day
          if (save.guesses.length === 1) st.firstTry = (st.firstTry ?? 0) + 1
        } else st.streak = 0
        save.stats = st
        setTimeout(() => toast(won() ? ['Called it.', 'Magnificent.', 'Splendid.', 'Great.', 'Phew.', 'That was close.'][save.guesses.length - 1] : 'Unlucky. It was a coin flip.'), 1100)
      }
      store(save)
      render()
    }

    function press(key) {
      if (over()) return
      if (key === 'ENTER') return submit()
      if (key === 'BACK') typed = typed.slice(0, -1)
      else if (/^[A-Z]$/.test(key) && typed.length < LENGTH) typed += key
      else return
      render()
    }

    function share() {
      const grid = save.guesses.map((g) => score(g, answer).map((m, i) => (i === SPLIT ? ' ' : '') + SQUARE[m]).join('')).join('\n')
      const text = `LOGGLE ${day} ${won() ? save.guesses.length : 'X'}/${GUESSES}\n${grid}\nnikstil.com/loggle`
      navigator.clipboard?.writeText(text).then(() => toast('Copied. Go ruin a group chat.'), () => toast('Your browser said no to the clipboard.'))
    }

    addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey || $('help').open) return
      const key = e.key === 'Enter' ? 'ENTER' : e.key === 'Backspace' ? 'BACK' : e.key.length === 1 ? e.key.toUpperCase() : null
      if (!key || (key.length === 1 && !/[A-Z]/.test(key))) return
      e.preventDefault()
      press(key)
    })
    $('help-btn').onclick = () => $('help').showModal()
    if (!save.seenHelp) { save.seenHelp = true; store(save); $('help').showModal() }
    render()
    window.loggle = { answer, day, answerFor, score }
  </script>
</body>
</html>
