<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nikstil</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .fullscreen-gif {
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Change to 'contain' if you do not want any part cropped */
      object-position: center;
      display: block;
    }
  </style>
</head>
<body>
  <img src="animation.gif" alt="Background GIF" class="fullscreen-gif">
</body>
</html>
