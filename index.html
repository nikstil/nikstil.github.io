  <!-- Theme and boot screen before the first paint (no flash). Keep the theme list in step with os.js. -->
  <script>
    try {
      var ids = ['aero', 'y2k', 'skeuo', 'minimal', 'retro', 'luna', 'aqua', 'vapor']
      var t = localStorage.getItem('nikstilos-theme') || localStorage.getItem('translatr-theme')
      if (ids.indexOf(t) >= 0) document.documentElement.setAttribute('data-theme', t)
      if (sessionStorage.getItem('nikstilos-booted') || matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('booted')
    } catch (e) {}
    // Site settings (edited on the admin page, /nikstil/), fetched now so they're in by the time
    // os.js runs. /?preview shows the admin page's unpublished draft instead (only on that device).
    try {
      var draft = /[?&]preview\b/.test(location.search) && localStorage.getItem('nikstil-preview')
      window.nikstilPreview = !!draft
      window.nikstilSite = draft
        ? Promise.resolve(JSON.parse(draft))
        : fetch('/site.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : null }).catch(function () { return null })
    } catch (e) {}
  </script>

          <button type="button" role="tab" class="acct-tab" data-mode="up" aria-selected="false">Create account</button>
        </div>
        <label class="acct-field"><span>Username</span><input name="username" class="acct-user" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required></label>
        <label class="acct-field"><span>Password</span><input name="password" type="password" class="acct-pass" autocomplete="current-password" minlength="6" required></label>
        <label class="acct-age" hidden><input type="checkbox" class="acct-agree"> <span>I’m 13 or older and I’ve read the <a href="/privacy/" target="_blank" rel="noopener">privacy notice</a>.</span></label>
        <p class="acct-error" role="alert" hidden></p>
        <button class="btn btn-primary acct-go">Sign in</button>
        <p class="acct-hint muted">No email needed. There’s no password reset either, so keep it somewhere safe.</p>
      </form>
      <div class="acct-in" hidden>
        <div class="acct-card">
          <img class="acct-avatar avatar" width="52" height="52" alt="Your profile picture">
          <div><b class="acct-name"></b><small class="muted acct-since"></small></div>
        </div>
        <fieldset class="acct-pics">
          <legend>Profile picture</legend>
          <ul class="acct-pic-list"></ul>
          <div class="acct-pic-buttons">
            <button type="button" class="btn acct-customize">✏️ Customize</button>
            <button type="button" class="btn acct-shuffle">🎲 More</button>
            <button type="button" class="btn acct-pic-default">Use my default</button>
          </div>
          <div class="acct-editor" hidden>
            <div class="acct-editor-top">
              <img class="acct-editor-preview avatar" width="96" height="96" alt="Preview of your picture">
              <div class="acct-editor-actions">
                <button type="button" class="btn btn-primary acct-editor-save">Save picture</button>
                <button type="button" class="btn acct-editor-random">🎲 Surprise me</button>
                <button type="button" class="btn acct-editor-cancel">Cancel</button>
              </div>
            </div>
            <div class="acct-editor-parts"></div>
          </div>
        </fieldset>
        <label class="acct-check"><input type="checkbox" class="acct-dms"> Let other players message me</label>
        <div class="acct-buttons">
          <button class="btn acct-signout">Sign out</button>
          <button class="btn acct-delete">Delete account…</button>
        </div>
        <p class="muted acct-links"><a href="/privacy/" target="_blank" rel="noopener">Privacy</a></p>
      </div>
    </div>
  </template>

  <script src="/online/online.js" defer></script>
  <script src="/online/avatar.js" defer></script>
  <script src="/os/online-apps.js" defer></script>
  <script src="/os/os.js" defer></script>
</body>
</html>
