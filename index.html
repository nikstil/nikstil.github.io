<!doctype html>
<html lang="en" data-theme="aero">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nikstilOS</title>
  <meta name="description" content="nikstil.com: a tiny retro desktop. Double-click TRANSLATR™, the world’s most monetized translator, or the GIF. Eight themes, one Recycle Bin.">
  <meta name="theme-color" content="#1a73c4">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nikstil.com/">
  <meta property="og:title" content="nikstilOS">
  <meta property="og:description" content="A tiny retro desktop. Double-click things. It’s 2009 somewhere.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Theme and boot screen before the first paint (no flash). Keep the theme list in step with os.js. -->
  <script>
    try {
      var ids = ['aero', 'y2k', 'skeuo', 'minimal', 'retro', 'luna', 'aqua', 'vapor']
      var t = localStorage.getItem('nikstilos-theme') || localStorage.getItem('translatr-theme')
      if (ids.indexOf(t) >= 0) document.documentElement.setAttribute('data-theme', t)
      if (sessionStorage.getItem('nikstilos-booted') || matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('booted')
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/os/os.css">
  <link rel="stylesheet" href="/os/cursors.css">
  <!-- Filled in by scripts/build-site.mjs from the game's own data. -->
  <script type="application/json" id="game-facts">{"endings":8,"items":27,"achievements":102,"themes":5}</script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true">
    <div class="wp-sky"></div>
    <div class="wp-rays"></div>
    <div class="wp-hills"></div>
    <span class="wp-bubble" style="left:6%;top:58%;width:92px;height:92px"></span>
    <span class="wp-bubble" style="left:31%;top:8%;width:62px;height:62px"></span>
    <span class="wp-bubble" style="left:58%;top:66%;width:120px;height:120px"></span>
    <span class="wp-bubble" style="left:78%;top:16%;width:54px;height:54px"></span>
    <span class="wp-bubble" style="left:90%;top:52%;width:84px;height:84px"></span>
    <div class="wp-noise"></div>
  </div>

  <main class="desktop" id="desktop" aria-label="Desktop">
    <h1 class="sr-only">nikstilOS: the nikstil.com desktop</h1>
    <ul class="desk-icons">
      <li><button class="desk-icon" data-app="pc"><span class="di-img" data-icon="pc" aria-hidden="true">💻</span><span class="di-label">This PC</span></button></li>
      <li><button class="desk-icon" data-app="translatr"><span class="di-img" data-icon="translatr" aria-hidden="true">🌐</span><span class="di-label">TRANSLATR™</span></button></li>
      <li><button class="desk-icon" data-app="gif"><span class="di-img" data-icon="gif" aria-hidden="true">🎞️</span><span class="di-label">The GIF</span></button></li>
      <li><button class="desk-icon" data-app="themes"><span class="di-img" data-icon="themes" aria-hidden="true">🎨</span><span class="di-label">Themes</span></button></li>
      <li><button class="desk-icon" data-app="bin"><span class="di-img" data-icon="bin" aria-hidden="true">🗑️</span><span class="di-label">Recycle Bin</span></button></li>
    </ul>
  </main>

  <div id="windows"></div>

  <nav class="taskbar" aria-label="Taskbar">
    <button class="start-btn" id="start-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="start-menu">
      <span class="start-orb" aria-hidden="true"><span class="start-glyph">n</span></span>
      <span class="start-label">Start</span>
    </button>
    <div class="tasks" id="tasks"></div>
    <div class="tray">
      <time class="clock" id="clock"></time>
      <button class="show-desktop" id="show-desktop" aria-label="Show desktop" title="Show desktop"></button>
    </div>
  </nav>

  <div class="start-menu" id="start-menu" role="menu" hidden>
    <div class="sm-banner" aria-hidden="true">nikstil<b>OS</b></div>
    <div class="sm-main">
      <div class="sm-head"><span class="sm-avatar" data-icon="avatar" aria-hidden="true">🙂</span><span>Guest</span></div>
      <div class="sm-cols">
        <ul class="sm-list">
          <li><button class="sm-item" role="menuitem" data-app="translatr"><span data-icon="translatr" aria-hidden="true">🌐</span> TRANSLATR™</button></li>
          <li><button class="sm-item" role="menuitem" data-app="gif"><span data-icon="gif" aria-hidden="true">🎞️</span> The GIF</button></li>
          <li><button class="sm-item" role="menuitem" data-app="pc"><span data-icon="pc" aria-hidden="true">💻</span> This PC</button></li>
          <li><button class="sm-item" role="menuitem" data-app="bin"><span data-icon="bin" aria-hidden="true">🗑️</span> Recycle Bin</button></li>
        </ul>
        <div class="sm-side">
          <div class="sm-heading">Themes</div>
          <ul class="sm-themes" id="sm-themes"></ul>
        </div>
      </div>
      <div class="sm-foot">
        <button class="sm-power" id="shutdown-btn" role="menuitem"><span aria-hidden="true">⏻</span> Shut down</button>
      </div>
    </div>
  </div>

  <div class="ctx-menu" id="ctx-menu" role="menu" hidden>
    <button class="ctx-item" role="menuitem" data-app="themes">Personalize…</button>
    <button class="ctx-item" role="menuitem" data-action="refresh">Refresh</button>
    <button class="ctx-item" role="menuitem" data-action="folder">New folder</button>
    <hr>
    <button class="ctx-item" role="menuitem" data-app="pc">About nikstilOS</button>
  </div>

  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot-logo">nikstil<b>OS</b></div>
    <div class="boot-bar"><i></i><i></i><i></i></div>
    <div class="boot-copy">Starting up. Please do not turn off your computer.</div>
  </div>

  <div class="shutdown" id="shutdown" role="dialog" aria-label="Shut down" hidden>
    <p class="shutdown-wait">nikstilOS is shutting down…</p>
    <p class="shutdown-safe">It’s now safe to turn off your computer.</p>
    <p class="shutdown-hint">(or click anywhere to turn it back on)</p>
  </div>

  <!-- ===== Window contents: edit freely, os.js only wires up the parts it names ===== -->

  <template id="app-pc">
    <div class="win-body pc">
      <div class="pc-logo" aria-hidden="true">nikstil<b>OS</b></div>
      <dl class="pc-specs">
        <dt>Edition</dt><dd>nikstilOS Ultimate</dd>
        <dt>Version</dt><dd>2026, build 1</dd>
        <dt>Memory</dt><dd>640 KB (ought to be enough for anybody)</dd>
        <dt>System type</dt><dd>8-bit operating system on a 64-bit browser</dd>
        <dt>Themes installed</dt><dd class="pc-themes">8</dd>
        <dt>Registered to</dt><dd>you, probably</dd>
      </dl>
      <p class="muted">Genuine. Activated. Unlicensed for commercial use, emotional support or taxes.</p>
    </div>
  </template>

  <template id="app-translatr">
    <div class="win-body translatr">
      <div class="tr-preview" aria-hidden="true">
        <div class="tr-mini">
          <div class="tr-mini-bar">🌐 TRANSLATR™ <i></i><i></i><i></i></div>
          <div class="tr-mini-client">
            <div class="tr-mini-input">Type something to have it ignored…</div>
            <div class="tr-mini-row"><span>2 vowel-taxed words</span><b>Translate · $60</b></div>
          </div>
        </div>
      </div>
      <h3 class="tr-name">TRANSLATR™ Ultra+ Pro Max</h3>
      <p>The world’s most monetized translator. $10 a word, vowels extra, every second request refused (and billed).</p>
      <ul class="tr-facts">
        <li><b class="f-endings">6</b> endings</li>
        <li><b class="f-items">27</b> items in 3 Mystery Boxes</li>
        <li><b class="f-achievements">90</b> achievements</li>
        <li>a <b>Daily Challenge</b></li>
      </ul>
      <p class="tr-save muted">Checking for a save on this device…</p>
    </div>
    <div class="win-foot">
      <a class="btn btn-primary tr-launch" href="/translatr/">▶ Launch</a>
    </div>
  </template>

  <template id="app-gif">
    <div class="win-body gif">
      <button class="gif-frame" title="Click to toggle">
        <img class="gif-img" src="/animation.gif" alt="The GIF (click to toggle)" width="480" height="270">
      </button>
      <p class="gif-missing muted" hidden>The GIF lives on nikstil.com, so it only shows up there.</p>
    </div>
    <div class="win-foot">
      <span class="status muted">animation.gif · click it</span>
      <a class="btn" href="/gif/">⛶ Full screen</a>
    </div>
  </template>

  <template id="app-themes">
    <div class="win-body themes">
      <p class="muted">Pick a look. The first five are TRANSLATR™’s, the last three are new.</p>
      <div class="theme-grid" id="theme-grid"></div>
    </div>
  </template>

  <template id="app-bin">
    <div class="win-body bin">
      <ul class="bin-list">
        <li><button class="bin-file" data-joke="old"><span aria-hidden="true">📄</span> old_homepage.html <small>“Pick one.”</small></button></li>
        <li><button class="bin-file" data-joke="motivation"><span aria-hidden="true">⚙️</span> motivation.exe <small>0 KB</small></button></li>
        <li><button class="bin-file" data-joke="sleep"><span aria-hidden="true">📕</span> sleep_schedule.pdf <small>corrupted</small></button></li>
        <li><button class="bin-file" data-joke="refund"><span aria-hidden="true">🧾</span> TRANSLATR_refund_policy.txt <small>0 bytes</small></button></li>
        <li><button class="bin-file" data-joke="ideas"><span aria-hidden="true">💡</span> ending_ideas_v7_FINAL(2).docx</button></li>
      </ul>
    </div>
    <div class="win-foot">
      <span class="status muted">5 items</span>
      <button class="btn bin-empty">Empty Recycle Bin</button>
    </div>
  </template>

  <script src="/os/os.js" defer></script>
</body>
</html>
