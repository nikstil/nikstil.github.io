<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#120608">
  <title>THE BUTTON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23555b61'/%3E%3Ccircle cx='16' cy='15' r='11' fill='%23e0261b'/%3E%3Ccircle cx='12.5' cy='11.5' r='3.5' fill='%23ff8a7a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="game.js"></script>
</head>
<body>
  <main class="top" id="top">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="banner" id="banner" aria-hidden="true"></div>
    <div class="strike" id="strike" aria-live="assertive"></div>
    <section class="bar" id="bar">
      <div class="hud" id="hud">
        <span id="clock"></span>
        <span id="carry" class="carry"></span>
        <span class="strikes" id="strikes" aria-label="Strikes"><i></i><i></i><i></i></span>
      </div>
      <div class="timer" id="timer" hidden><i></i><span></span></div>
      <p class="say" id="say"></p>
      <div class="text" id="text" aria-live="polite"></div>
      <div class="opts">
        <div class="opt" id="optA"><b>CLICK</b><span></span></div>
        <div class="opt" id="optB"><i class="fill"></i><b>HOLD 1 SEC</b><span></span></div>
      </div>
    </section>
  </main>
  <footer class="panel">
    <button id="btn" class="bezel" type="button" aria-label="The button" autofocus>
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47"/></svg>
      <span class="cap"></span>
    </button>
  </footer>
</body>
</html>
