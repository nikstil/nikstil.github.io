<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0c0e">
<title>Containment</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b0c0e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%238a9099'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0c0e;
    touch-action: none; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #valve-btn {
    position: fixed; left: 50%; top: 50%;
    width: 120px; height: 120px; margin: -60px 0 0 -60px; padding: 0;
    border: 0; border-radius: 50%; background: transparent;
    cursor: pointer; touch-action: none; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  #valve-btn:focus-visible { box-shadow: 0 0 0 2px rgba(200, 210, 220, 0.3); }
  #valve-btn.locked { pointer-events: none; cursor: default; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<button id="valve-btn" type="button" aria-label="Valve"></button>
<script>
;(function () {
  'use strict'

  // ═══════════ Rules
  const KEY = 'containment_outcome'
  const CRISIS = 50 // seconds to hold it together
  const HOLD = 0.18 // a press longer than this is a hold; shorter is a tap
  const JAM_GAP = 0.13 // three taps closer together than this jam the valve
  const JAM_TIME = 1.2
  const LOCK_TIME = 1.8 // after a blowout
  const TAU = Math.PI * 2
  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v)
  const lerp = (a, b, t) => a + (b - a) * t
  const smooth = (x) => x * x * (3 - 2 * x)
  const clock = () => performance.now() / 1000

  const cv = document.getElementById('c')
  const g = cv.getContext('2d')
  let btn = document.getElementById('valve-btn')
  const btnParent = btn.parentNode

  // ═══════════ State
  let phase = 'dormant' // dormant · crisis · stabilized · breached
  const S = {}
  function fresh() {
    Object.assign(S, {
      t: 0, breach: 0.06, heat: 0, esc: 1, shown: 0.06,
      pressing: false, holding: false, downAt: 0, pid: null,
      lockUntil: 0, jamUntil: 0, taps: [], nextSurge: 15,
      shake: 0, flash: 0, klaxonOn: false, alarm: false, beatAt: 0, beatPulse: 0,
      endAt: 0, jitterX: 0, jitterY: 0,
    })
    parts.length = 0
  }
  const parts = [] // steam, smoke, sparks, ripples
  fresh()

  let saved = null
  try { saved = localStorage.getItem(KEY) } catch (e) {}
  if (saved === 'stabilized' || saved === 'breached') {
    phase = saved
    S.endAt = -100 // ended long ago: no transition
    btn.remove()
  }

  // ═══════════ Input: one valve
  function down(e) {
    if (phase === 'stabilized' || phase === 'breached' || S.pressing) return
    const now = clock()
    if (now < S.lockUntil || now < S.jamUntil) return
    if (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return
      e.preventDefault()
      S.pid = e.pointerId
      try { btn.setPointerCapture(e.pointerId) } catch (err) {}
    }
    audio.wake()
    if (phase === 'dormant') begin()
    // panic: three presses in a row, each less than 130 ms after the last
    S.taps.push(now)
    while (S.taps.length > 3) S.taps.shift()
    if (S.taps.length === 3 && S.taps[2] - S.taps[1] < JAM_GAP && S.taps[1] - S.taps[0] < JAM_GAP) return jam(now)
    S.pressing = true
    S.holding = false
    S.downAt = now
  }
  function up() {
    if (!S.pressing) return
    const now = clock()
    S.pressing = false
    S.pid = null
    if (S.holding) {
      S.holding = false
      S.taps.length = 0
      if (S.heat > 0.45) vent()
    } else if (now - S.downAt < HOLD) tap()
  }
  function bindButton(b) {
    b.addEventListener('pointerdown', down)
    b.addEventListener('contextmenu', (e) => e.preventDefault())
  }
  bindButton(btn)
  window.addEventListener('pointerup', (e) => { if (e.pointerId === S.pid) up() })
  window.addEventListener('pointercancel', (e) => { if (e.pointerId === S.pid) up() })
  window.addEventListener('blur', up)
  const isKey = (e) => e.key === ' ' || e.key === 'Enter'
  window.addEventListener('keydown', (e) => {
    if (isKey(e)) {
      e.preventDefault()
      if (!e.repeat && document.activeElement === btn) down(null)
    }
  })
  window.addEventListener('keyup', (e) => { if (isKey(e)) { e.preventDefault(); up() } })
  for (const ev of ['contextmenu', 'selectstart', 'dragstart', 'gesturestart']) document.addEventListener(ev, (e) => e.preventDefault())

  // ═══════════ What happens
  function begin() {
    phase = 'crisis'
    S.t = 0
    audio.startCrisis()
  }
  function tap() {
    // the manual pump: a shove of pressure that pushes the dark back
    S.breach = clamp(S.breach - 0.075)
    S.heat = clamp(S.heat + 0.04)
    parts.push({ type: 'ripple', r: 62, life: 0, max: 0.7 })
    audio.thump()
  }
  function vent() {
    audio.hiss(S.heat)
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * TAU, sp = 160 + Math.random() * 420
      parts.push({ type: 'steam', x: W / 2 + Math.cos(a) * 60, y: H / 2 + Math.sin(a) * 60, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: 6 + Math.random() * 10, life: 0, max: 0.7 + Math.random() * 0.7 })
    }
  }
  function blowout(now) {
    S.heat = 1
    S.pressing = false
    S.holding = false
    S.taps.length = 0
    S.lockUntil = now + LOCK_TIME
    S.breach = clamp(S.breach + 0.08)
    S.shake = 10
    btn.classList.add('locked')
    if (S.pid != null) try { btn.releasePointerCapture(S.pid) } catch (e) {}
    S.pid = null
    audio.blowout()
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * TAU, sp = 260 + Math.random() * 620
      parts.push({ type: 'steam', x: W / 2 + Math.cos(a) * 58, y: H / 2 + Math.sin(a) * 58, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: 8 + Math.random() * 14, life: 0, max: 0.9 + Math.random() * 0.9 })
    }
  }
  function jam(now) {
    S.jamUntil = now + JAM_TIME
    S.taps.length = 0
    S.pressing = false
    btn.classList.add('locked')
    if (S.pid != null) try { btn.releasePointerCapture(S.pid) } catch (e) {}
    S.pid = null
    audio.grind()
  }
  function surge() {
    S.breach = clamp(S.breach + 0.18)
    S.shake = 16
    audio.seismic()
  }
  function save(v) {
    try { localStorage.setItem(KEY, v) } catch (e) {}
  }
  function stabilize(now) {
    phase = 'stabilized'
    S.endAt = now
    save('stabilized')
    btn.remove()
    audio.stabilize()
  }
  function breachOut(now) {
    phase = 'breached'
    S.endAt = now
    save('breached')
    btn.remove()
    audio.implode()
  }

  // ═══════════ The hidden reset: Escape three times within a second and a half
  const escapes = []
  window.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || e.repeat) return
    const now = clock()
    escapes.push(now)
    while (escapes.length && now - escapes[0] > 1.5) escapes.shift()
    if (escapes.length >= 3) {
      escapes.length = 0
      try { localStorage.removeItem(KEY) } catch (err) {} // only this piece's key; the rest of the site keeps its saves
      audio.silence()
      fresh()
      phase = 'dormant'
      btn.classList.remove('locked')
      if (!btn.parentNode) btnParent.appendChild(btn)
    }
  })

  // ═══════════ Every frame
  function update(now, dt) {
    if (phase !== 'crisis') return
    S.t += dt
    S.esc = 1 + 1.4 * clamp(S.t / CRISIS)
    if (S.pressing && !S.holding && now - S.downAt >= HOLD) S.holding = true
    const locked = now < S.lockUntil
    if (!locked && btn.classList.contains('locked') && now >= S.jamUntil) btn.classList.remove('locked')
    if (S.holding) {
      S.breach -= 0.22 * dt
      S.heat += 0.28 * dt
      if (S.heat >= 1) blowout(now)
    } else {
      S.breach += 0.18 * S.esc * dt * (locked ? 1.6 : 1)
      S.heat -= 0.32 * dt
    }
    S.heat = clamp(S.heat)
    S.breach = clamp(S.breach)
    if (S.t < 5) S.breach = Math.min(S.breach, 0.99)
    // seismic surges, every eight seconds between 15 and 35
    if (S.t >= S.nextSurge && S.nextSurge < 35) {
      surge()
      S.nextSurge += 8
    }
    // the last fifteen seconds: when it is nearly gone, the alarm and the heartbeat
    S.alarm = S.t >= 35 && (S.breach > 0.75 || S.heat > 0.78)
    S.klaxonOn = S.alarm && (now % 0.9) < 0.5
    if (S.alarm && now >= S.beatAt) {
      const sev = Math.max(clamp((S.breach - 0.75) / 0.25), clamp((S.heat - 0.78) / 0.22), clamp((S.t - 35) / 15))
      S.beatAt = now + lerp(0.85, 0.34, sev)
      S.beatPulse = 1
      audio.heartbeat()
    }
    if (S.breach >= 1 && S.t >= 5) return breachOut(now)
    if (S.t >= CRISIS) return stabilize(now)
    // jam sparks, blowout smoke
    if (now < S.jamUntil && Math.random() < 0.7) {
      for (let i = 0; i < 3; i++) {
        const a = Math.random() * TAU
        parts.push({ type: 'spark', x: W / 2 + 9 + Math.cos(a) * 60, y: H / 2 - 6 + Math.sin(a) * 60, vx: Math.cos(a) * (120 + Math.random() * 380), vy: Math.sin(a) * (120 + Math.random() * 380) - 120, life: 0, max: 0.3 + Math.random() * 0.4 })
      }
    }
    if (locked && Math.random() < 0.6) parts.push({ type: 'smoke', x: W / 2 + (Math.random() - 0.5) * 70, y: H / 2 + (Math.random() - 0.5) * 30, vx: (Math.random() - 0.5) * 20, vy: -40 - Math.random() * 50, s: 10 + Math.random() * 12, life: 0, max: 1.6 + Math.random() })
    audio.update(S, now)
  }

  // ═══════════ Drawing
  let W = 0, H = 0, dpr = 1
  const bg = document.createElement('canvas')
  const flecks = Array.from({ length: 260 }, () => ({ a: Math.random() * TAU, q: 1 + Math.random() * 0.7, sp: 0.05 + Math.random() * 0.2, s: Math.random() < 0.85 ? 1 : 2 }))
  const spikes = Array.from({ length: 9 }, (_, k) => ({ a: (k / 9) * TAU + Math.random() * 0.4, w: 0.035 + Math.random() * 0.05, ph: Math.random() * TAU }))

  function resize() {
    W = window.innerWidth
    H = window.innerHeight
    dpr = Math.min(1.5, window.devicePixelRatio || 1)
    cv.width = Math.round(W * dpr)
    cv.height = Math.round(H * dpr)
    paintBackground()
  }

  /** The room, drawn once: steel plate, seams, rivets, pipes running into the valve's housing. */
  function paintBackground() {
    bg.width = cv.width
    bg.height = cv.height
    const b = bg.getContext('2d')
    b.setTransform(dpr, 0, 0, dpr, 0, 0)
    const cx = W / 2, cy = H / 2
    const base = b.createLinearGradient(0, 0, 0, H)
    base.addColorStop(0, '#16181b')
    base.addColorStop(1, '#0c0d0f')
    b.fillStyle = base
    b.fillRect(0, 0, W, H)
    // diamond plate
    b.fillStyle = 'rgba(255,255,255,0.025)'
    for (let y = 0; y < H + 24; y += 24) {
      for (let x = (y / 24) % 2 ? 12 : 0; x < W + 24; x += 24) {
        b.save()
        b.translate(x, y)
        b.rotate(((x + y) / 24) % 2 ? 0.7 : -0.7)
        b.beginPath()
        b.ellipse(0, 0, 7, 2, 0, 0, TAU)
        b.fill()
        b.restore()
      }
    }
    // panel seams and rivets
    const step = 180
    for (let x = (cx % step) - step / 2; x < W; x += step) {
      b.fillStyle = 'rgba(0,0,0,0.45)'
      b.fillRect(x, 0, 2, H)
      b.fillStyle = 'rgba(255,255,255,0.05)'
      b.fillRect(x + 2, 0, 1, H)
    }
    for (let y = (cy % step) - step / 2; y < H; y += step) {
      b.fillStyle = 'rgba(0,0,0,0.45)'
      b.fillRect(0, y, W, 2)
      b.fillStyle = 'rgba(255,255,255,0.05)'
      b.fillRect(0, y + 2, W, 1)
      for (let x = (cx % step) - step / 2; x < W; x += step) rivet(b, x + 12, y + 12)
    }
    // pipes running in from the edges
    const angles = [0.35, 1.2, 2.05, 2.9, 3.75, 4.55, 5.4]
    for (const a of angles) {
      const ex = cx + Math.cos(a) * Math.hypot(W, H), ey = cy + Math.sin(a) * Math.hypot(W, H)
      const sx = cx + Math.cos(a) * 92, sy = cy + Math.sin(a) * 92
      b.lineCap = 'butt'
      b.strokeStyle = '#08090a'
      b.lineWidth = 30
      b.beginPath(); b.moveTo(sx, sy); b.lineTo(ex, ey); b.stroke()
      b.strokeStyle = '#2a2e33'
      b.lineWidth = 24
      b.beginPath(); b.moveTo(sx, sy); b.lineTo(ex, ey); b.stroke()
      b.strokeStyle = 'rgba(255,255,255,0.08)'
      b.lineWidth = 5
      b.beginPath(); b.moveTo(sx - Math.sin(a) * 6, sy + Math.cos(a) * 6); b.lineTo(ex - Math.sin(a) * 6, ey + Math.cos(a) * 6); b.stroke()
      for (let d = 160; d < Math.hypot(W, H); d += 220) {
        const fx = cx + Math.cos(a) * d, fy = cy + Math.sin(a) * d
        b.save()
        b.translate(fx, fy)
        b.rotate(a)
        b.fillStyle = '#1d2024'
        b.fillRect(-5, -19, 10, 38)
        b.fillStyle = 'rgba(255,255,255,0.06)'
        b.fillRect(-5, -19, 2, 38)
        b.restore()
      }
    }
    // the housing the valve sits in
    const ring = b.createRadialGradient(cx, cy, 60, cx, cy, 96)
    ring.addColorStop(0, '#050506')
    ring.addColorStop(0.12, '#2b2f34')
    ring.addColorStop(0.5, '#3c4148')
    ring.addColorStop(0.85, '#1f2226')
    ring.addColorStop(1, '#0b0c0e')
    b.fillStyle = ring
    b.beginPath(); b.arc(cx, cy, 96, 0, TAU); b.fill()
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * TAU + 0.2
      rivet(b, cx + Math.cos(a) * 82, cy + Math.sin(a) * 82, 4)
    }
    // the light: one dim lamp above, the corners lost
    const lamp = b.createRadialGradient(cx, cy - H * 0.15, 0, cx, cy, Math.hypot(W, H) * 0.6)
    lamp.addColorStop(0, 'rgba(190, 200, 210, 0.06)')
    lamp.addColorStop(0.5, 'rgba(0, 0, 0, 0.25)')
    lamp.addColorStop(1, 'rgba(0, 0, 0, 0.75)')
    b.fillStyle = lamp
    b.fillRect(0, 0, W, H)
  }
  function rivet(b, x, y, r = 3) {
    const gr = b.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r)
    gr.addColorStop(0, '#5c636b')
    gr.addColorStop(1, '#16181b')
    b.fillStyle = gr
    b.beginPath(); b.arc(x, y, r, 0, TAU); b.fill()
  }

  /** The valve: brushed steel, heating through amber and crimson to white. */
  function valve(now, alpha) {
    const cx = W / 2, cy = H / 2, R = 60
    const h = S.heat
    const locked = now < S.lockUntil
    const jammed = now < S.jamUntil
    let x = cx, y = cy, rot = 0
    if (S.holding || h > 0.05) {
      const amp = (S.holding ? 7 : 2) * h * h + (S.holding ? 0.6 : 0)
      x += (Math.random() - 0.5) * 2 * amp
      y += (Math.random() - 0.5) * 2 * amp
    }
    if (jammed) { x += 9; y -= 6; rot = 0.21 }
    if (locked) y += 3
    g.save()
    g.globalAlpha = alpha
    g.translate(x, y)
    g.rotate(rot)
    // the steel
    let face
    if (g.createConicGradient) {
      face = g.createConicGradient(0.6, 0, 0)
      const st = ['#9aa1a9', '#6c727a', '#b4bac1', '#5f656c', '#a3a9b0', '#70767e', '#9aa1a9']
      st.forEach((c, i) => face.addColorStop(i / (st.length - 1), c))
    } else {
      face = g.createRadialGradient(-15, -15, 5, 0, 0, R)
      face.addColorStop(0, '#b4bac1'); face.addColorStop(1, '#5f656c')
    }
    g.fillStyle = face
    g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill()
    g.strokeStyle = 'rgba(255,255,255,0.05)'
    g.lineWidth = 1
    for (let r = 8; r < R; r += 3) { g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke() }
    // grip notches round the rim
    g.fillStyle = 'rgba(0,0,0,0.35)'
    for (let k = 0; k < 18; k++) {
      const a = (k / 18) * TAU
      g.beginPath(); g.arc(Math.cos(a) * (R - 4), Math.sin(a) * (R - 4), 3, 0, TAU); g.fill()
    }
    // the bevel
    const bev = g.createLinearGradient(-R, -R, R, R)
    bev.addColorStop(0, 'rgba(255,255,255,0.45)')
    bev.addColorStop(1, 'rgba(0,0,0,0.6)')
    g.strokeStyle = bev
    g.lineWidth = 3
    g.beginPath(); g.arc(0, 0, R - 1.5, 0, TAU); g.stroke()
    // the hub
    const hub = g.createRadialGradient(-6, -6, 1, 0, 0, 20)
    hub.addColorStop(0, '#c8cdd3'); hub.addColorStop(1, '#4a4f56')
    g.fillStyle = hub
    g.beginPath(); g.arc(0, 0, 18, 0, TAU); g.fill()
    // heat
    if (h > 0.12) {
      const c = heatColour(h)
      g.globalCompositeOperation = 'source-over'
      g.fillStyle = 'rgba(' + c + ',' + (clamp((h - 0.12) / 0.6) * 0.88).toFixed(3) + ')'
      g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill()
    }
    // a blowout leaves it dark and sunk in
    if (locked) {
      g.fillStyle = 'rgba(6, 6, 7, 0.82)'
      g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill()
      const sh = g.createRadialGradient(0, -8, R * 0.5, 0, 0, R)
      sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.9)')
      g.fillStyle = sh
      g.beginPath(); g.arc(0, 0, R, 0, TAU); g.fill()
    }
    g.restore()
    // bloom
    if (h > 0.08 && !locked) {
      g.save()
      g.globalAlpha = alpha
      g.globalCompositeOperation = 'lighter'
      const r = 60 + 300 * Math.pow(h, 1.6)
      const bl = g.createRadialGradient(x, y, 20, x, y, r)
      bl.addColorStop(0, 'rgba(255, 120, 30, ' + (0.8 * Math.pow(h, 1.4)).toFixed(3) + ')')
      bl.addColorStop(0.4, 'rgba(255, 80, 20, ' + (0.28 * Math.pow(h, 1.4)).toFixed(3) + ')')
      bl.addColorStop(1, 'rgba(255, 60, 10, 0)')
      g.fillStyle = bl
      g.fillRect(x - r, y - r, r * 2, r * 2)
      if (h > 0.75) {
        const w = clamp((h - 0.75) * 4)
        const core = g.createRadialGradient(x, y, 0, x, y, 120 + 120 * w)
        core.addColorStop(0, 'rgba(255, 250, 235, ' + (0.9 * w).toFixed(3) + ')')
        core.addColorStop(1, 'rgba(255, 220, 160, 0)')
        g.fillStyle = core
        g.fillRect(x - 260, y - 260, 520, 520)
      }
      g.restore()
    }
    // dormant: a faint pulse, asking to be pressed
    if (phase === 'dormant') {
      const p = 0.5 + 0.5 * Math.sin(now * 2.4)
      g.strokeStyle = 'rgba(190, 205, 220, ' + (0.08 + 0.14 * p).toFixed(3) + ')'
      g.lineWidth = 2
      g.beginPath(); g.arc(cx, cy, 64 + 4 * p, 0, TAU); g.stroke()
    }
  }
  function heatColour(h) {
    const stops = [[0.12, [150, 155, 162]], [0.4, [255, 158, 40]], [0.65, [215, 28, 20]], [0.9, [255, 250, 235]]]
    for (let i = 1; i < stops.length; i++) {
      if (h <= stops[i][0]) {
        const [a0, c0] = stops[i - 1], [a1, c1] = stops[i]
        const t = (h - a0) / (a1 - a0)
        return c0.map((v, k) => Math.round(lerp(v, c1[k], t))).join(',')
      }
    }
    return stops[stops.length - 1][1].join(',')
  }

  /** The dark: black static closing in from the edges, reaching for the valve. */
  function darkness(b, now) {
    if (b <= 0.002) return
    const cx = W / 2, cy = H / 2
    const Rmax = Math.hypot(W, H) / 2 + 40
    const R = Rmax * Math.pow(1 - b, 0.85)
    const amp = 0.05 + 0.22 * b
    const N = 128
    g.beginPath()
    g.rect(-60, -60, W + 120, H + 120)
    const edge = new Float32Array(N)
    for (let i = 0; i < N; i++) {
      const a = (i / N) * TAU
      let w = 0.5 + 0.25 * Math.sin(5 * a + now * 0.9) + 0.15 * Math.sin(11 * a - now * 1.7) + 0.1 * Math.sin(23 * a + now * 3.1)
      let spike = 0
      for (const s of spikes) {
        let d = Math.abs(a - s.a - Math.sin(now * 0.3 + s.ph) * 0.2) % TAU
        if (d > Math.PI) d = TAU - d
        spike += Math.exp(-Math.pow(d / s.w, 2)) * (0.22 + 0.12 * Math.sin(now * 2.3 + s.ph)) * b
      }
      const r = Math.max(0, R * (1 - amp * w - spike))
      edge[i] = r
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r
      i ? g.lineTo(x, y) : g.moveTo(x, y)
    }
    g.closePath()
    g.fillStyle = '#000'
    g.fill('evenodd')
    const soft = g.createRadialGradient(cx, cy, R * 0.45, cx, cy, R * 1.02)
    soft.addColorStop(0, 'rgba(0,0,0,0)')
    soft.addColorStop(1, 'rgba(0,0,0,' + (0.5 + 0.4 * b).toFixed(3) + ')')
    g.fillStyle = soft
    g.fillRect(0, 0, W, H)
    // static crawling inward through it
    for (const f of flecks) {
      f.q -= f.sp * 0.016 * (0.6 + b)
      if (f.q < 1.0) { f.q = 1.15 + Math.random() * 0.6; f.a = Math.random() * TAU }
      const i = Math.floor(((f.a % TAU) / TAU) * N) % N
      const r = edge[i] * f.q + 4
      const x = cx + Math.cos(f.a) * r, y = cy + Math.sin(f.a) * r
      if (x < 0 || y < 0 || x > W || y > H) continue
      const v = 90 + Math.random() * 140
      g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (0.25 + Math.random() * 0.5).toFixed(2) + ')'
      g.fillRect(x, y, f.s, f.s)
    }
  }

  function particles(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]
      p.life += dt
      const k = p.life / p.max
      if (k >= 1) { parts.splice(i, 1); continue }
      if (p.type === 'ripple') {
        p.r += 620 * dt
        g.strokeStyle = 'rgba(200, 230, 255, ' + (0.55 * (1 - k)).toFixed(3) + ')'
        g.lineWidth = 3 * (1 - k) + 1
        g.beginPath(); g.arc(W / 2, H / 2, p.r, 0, TAU); g.stroke()
        continue
      }
      p.x += p.vx * dt
      p.y += p.vy * dt
      if (p.type === 'steam') {
        p.vx *= 1 - 2.2 * dt; p.vy *= 1 - 2.2 * dt; p.s += 40 * dt
        g.fillStyle = 'rgba(235, 240, 245, ' + (0.35 * (1 - k)).toFixed(3) + ')'
        g.beginPath(); g.arc(p.x, p.y, p.s, 0, TAU); g.fill()
      } else if (p.type === 'smoke') {
        p.s += 18 * dt
        g.fillStyle = 'rgba(60, 62, 66, ' + (0.4 * (1 - k)).toFixed(3) + ')'
        g.beginPath(); g.arc(p.x, p.y, p.s, 0, TAU); g.fill()
      } else if (p.type === 'spark') {
        p.vy += 900 * dt
        g.strokeStyle = 'rgba(255, ' + Math.round(200 - 120 * k) + ', 60, ' + (1 - k).toFixed(3) + ')'
        g.lineWidth = 1.6
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02); g.stroke()
      }
    }
  }

  let last = clock()
  function frame() {
    const now = clock()
    const dt = Math.min(0.05, Math.max(0, now - last))
    last = now
    update(now, dt)
    g.setTransform(dpr, 0, 0, dpr, 0, 0)

    if (phase === 'breached') {
      g.fillStyle = '#000'
      g.fillRect(0, 0, W, H)
      return requestAnimationFrame(frame)
    }
    // shake
    S.shake *= Math.exp(-dt * 3.2)
    const sx = (Math.random() - 0.5) * 2 * S.shake, sy = (Math.random() - 0.5) * 2 * S.shake
    g.translate(sx, sy)
    g.drawImage(bg, -20, -20, W + 40, H + 40)

    if (phase === 'stabilized') {
      // the dark dissolves into a calm, softly lit room
      const k = smooth(clamp((now - S.endAt) / 3.5))
      S.shown = lerp(S.shown, 0, 1 - Math.exp(-dt * 2))
      const warm = g.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H / 2, Math.hypot(W, H) * 0.65)
      warm.addColorStop(0, 'rgba(255, 226, 190, ' + (0.32 * k).toFixed(3) + ')')
      warm.addColorStop(1, 'rgba(255, 200, 150, ' + (0.08 * k).toFixed(3) + ')')
      g.fillStyle = warm
      g.fillRect(0, 0, W, H)
      if (k < 1) valve(now, 1 - k)
      darkness(S.shown * (1 - k), now)
      return requestAnimationFrame(frame)
    }

    // the overhead lamp flickers more as it gets worse
    if (phase === 'crisis' && Math.random() < 0.04 * S.esc) {
      g.fillStyle = 'rgba(0,0,0,' + (0.1 + Math.random() * 0.25).toFixed(2) + ')'
      g.fillRect(0, 0, W, H)
    }
    valve(now, 1)
    particles(dt)
    S.shown += (S.breach - S.shown) * (1 - Math.exp(-dt / 0.12))
    S.beatPulse *= Math.exp(-dt * 6)
    darkness(clamp(S.shown + 0.03 * S.beatPulse), now)
    // the alarm: crimson, in time with the klaxon
    S.flash += ((S.klaxonOn ? 1 : 0) - S.flash) * (1 - Math.exp(-dt / 0.06))
    if (S.flash > 0.01) {
      g.fillStyle = 'rgba(200, 10, 10, ' + (0.26 * S.flash).toFixed(3) + ')'
      g.fillRect(-20, -20, W + 40, H + 40)
    }
    requestAnimationFrame(frame)
  }

  // ═══════════ Sound: all of it synthesised as it happens
  const audio = {
    ctx: null,
    wake() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext
        if (!AC) return
        try { this.ctx = new AC({ latencyHint: 'interactive' }) } catch (e) { this.ctx = new AC() }
        this.build()
      }
      if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {})
    },
    build() {
      const c = this.ctx
      const G = (v) => { const n = c.createGain(); n.gain.value = v; return n }
      const F = (type, f, q) => { const n = c.createBiquadFilter(); n.type = type; n.frequency.value = f; if (q != null) n.Q.value = q; return n }
      const O = (type, f) => { const n = c.createOscillator(); n.type = type; n.frequency.value = f; return n }
      this.G = G; this.F = F; this.O = O
      const nb = c.createBuffer(1, c.sampleRate * 2, c.sampleRate)
      const d = nb.getChannelData(0)
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1
      this.noiseBuf = nb
      const comp = c.createDynamicsCompressor()
      comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2
      comp.connect(c.destination)
      this.out = G(0.9); this.out.connect(comp)
      this.bus = G(1); this.bus.connect(this.out) // everything the breach cuts off
      this.last = G(1); this.last.connect(comp) // what plays after the cut
      const noise = () => { const s = c.createBufferSource(); s.buffer = nb; s.loop = true; s.start(); return s }
      // the drone: sub-bass, slowly fading in
      this.drone = G(0)
      for (const [f, t, v] of [[41.2, 'sine', 0.5], [41.9, 'sine', 0.5], [55, 'triangle', 0.18]]) { const o = O(t, f), gg = G(v); o.connect(gg); gg.connect(this.drone); o.start() }
      const rum = noise(), rumF = F('lowpass', 90, 0.7), rumG = G(0.6)
      rum.connect(rumF); rumF.connect(rumG); rumG.connect(this.drone)
      this.drone.connect(this.bus)
      // the static of the dark
      const st = noise(), stH = F('highpass', 1200, 0.7), stB = F('bandpass', 3200, 0.6)
      this.static = G(0)
      st.connect(stH); stH.connect(stB); stB.connect(this.static); this.static.connect(this.bus)
      // the turbine whine: exponential with heat, and dirtier
      this.turb1 = O('sawtooth', 180); this.turb2 = O('square', 270)
      this.turb2.detune.value = 7
      this.drive = G(1)
      const shaper = c.createWaveShaper(), curve = new Float32Array(1024)
      for (let i = 0; i < 1024; i++) { const x = (i / 1023) * 2 - 1; curve[i] = Math.tanh(4 * x) }
      shaper.curve = curve
      this.turbBand = F('bandpass', 400, 0.9)
      this.turb = G(0)
      const t2g = G(0.5)
      this.turb1.connect(this.drive); this.turb2.connect(t2g); t2g.connect(this.drive)
      this.drive.connect(shaper); shaper.connect(this.turbBand); this.turbBand.connect(this.turb); this.turb.connect(this.bus)
      this.turb1.start(); this.turb2.start()
      // the klaxon: low, two sour squares
      this.klax = G(0)
      const kf = F('lowpass', 700, 1)
      for (const f of [98, 104]) { const o = O('square', f), gg = G(0.5); o.connect(gg); gg.connect(kf); o.start() }
      kf.connect(this.klax); this.klax.connect(this.bus)
    },
    startCrisis() {
      if (!this.ctx) return
      const t = this.ctx.currentTime
      this.bus.gain.cancelScheduledValues(t)
      this.bus.gain.setValueAtTime(1, t)
      this.last.gain.setValueAtTime(1, t)
    },
    _at: 0,
    update(s, now) {
      if (!this.ctx || now - this._at < 0.033) return
      this._at = now
      const t = this.ctx.currentTime, T = 0.06
      this.drone.gain.setTargetAtTime(0.32 * clamp(s.t / 15) * (0.75 + 0.25 * (s.esc - 1) / 1.4), t, 0.3)
      this.static.gain.setTargetAtTime(0.09 * Math.pow(s.breach, 1.4) * (0.5 + Math.random()), t, 0.03)
      const f = 180 * Math.pow(2, s.heat * 3.4)
      this.turb1.frequency.setTargetAtTime(f, t, T)
      this.turb2.frequency.setTargetAtTime(f * 1.5, t, T)
      this.turbBand.frequency.setTargetAtTime(f * 2, t, T)
      this.drive.gain.setTargetAtTime(0.4 + 6 * s.heat * s.heat, t, T)
      this.turb.gain.setTargetAtTime(s.heat > 0.02 ? (s.holding ? 0.05 + 0.13 * s.heat : 0.05 * s.heat) : 0, t, 0.08)
      this.klax.gain.setTargetAtTime(s.klaxonOn ? 0.16 : 0, t, 0.015)
    },
    // one-shots
    _noise(at, dur, type, f, q, peak, decay, dest) {
      const c = this.ctx, s = c.createBufferSource(), fl = this.F(type, f, q), g2 = this.G(0)
      s.buffer = this.noiseBuf
      g2.gain.setValueAtTime(peak, at)
      g2.gain.setTargetAtTime(0, at + 0.002, decay)
      s.connect(fl); fl.connect(g2); g2.connect(dest || this.bus)
      s.start(at, Math.random()); s.stop(at + dur)
      return fl
    },
    _tone(at, f0, f1, dur, peak, type, dest) {
      const o = this.O(type || 'sine', f0), g2 = this.G(0)
      o.frequency.setValueAtTime(f0, at)
      o.frequency.exponentialRampToValueAtTime(f1, at + dur)
      g2.gain.setValueAtTime(0, at)
      g2.gain.linearRampToValueAtTime(peak, at + 0.005)
      g2.gain.setTargetAtTime(0, at + 0.01, dur / 3)
      o.connect(g2); g2.connect(dest || this.bus)
      o.start(at); o.stop(at + dur * 2 + 0.1)
    },
    _ring(at, modes, decay, peak, dest) {
      const c = this.ctx, s = c.createBufferSource(), e = this.G(0)
      s.buffer = this.noiseBuf
      e.gain.setValueAtTime(1, at); e.gain.setTargetAtTime(0, at, 0.004)
      s.connect(e)
      for (const f of modes) {
        const b = this.F('bandpass', f, 40), g2 = this.G(0)
        g2.gain.setValueAtTime(peak, at); g2.gain.setTargetAtTime(0, at, decay)
        e.connect(b); b.connect(g2); g2.connect(dest || this.bus)
      }
      s.start(at, Math.random()); s.stop(at + 0.05)
    },
    thump() {
      if (!this.ctx) return
      const t = this.ctx.currentTime
      this._tone(t, 150, 52, 0.13, 0.7)
      this._noise(t, 0.05, 'lowpass', 1400, 0.7, 0.5, 0.012)
      this._noise(t + 0.03, 0.08, 'highpass', 4000, 0.7, 0.08, 0.02)
    },
    hiss(heat) {
      if (!this.ctx) return
      const t = this.ctx.currentTime, dur = 0.7 + heat
      const fl = this._noise(t, dur + 0.5, 'bandpass', 5200, 0.8, 0.5 * heat, dur / 3)
      fl.frequency.setValueAtTime(5200, t)
      fl.frequency.exponentialRampToValueAtTime(1900, t + dur)
    },
    blowout() {
      if (!this.ctx) return
      const t = this.ctx.currentTime
      this._noise(t, 0.04, 'highpass', 2500, 0.7, 0.9, 0.006)
      this._ring(t, [612, 1489, 2711, 3905, 5233], 0.12, 0.5)
      this._tone(t, 130, 45, 0.18, 0.8)
      const roar = this._noise(t + 0.02, 2.2, 'lowpass', 2600, 0.6, 0.7, 0.6)
      roar.frequency.setValueAtTime(2600, t)
      roar.frequency.exponentialRampToValueAtTime(320, t + 1.8)
    },
    grind() {
      if (!this.ctx) return
      const c = this.ctx, t = c.currentTime
      const o = this.O('sawtooth', 70), lfo = this.O('square', 23), ld = this.G(35), g2 = this.G(0)
      const sh = c.createWaveShaper(), curve = new Float32Array(512)
      for (let i = 0; i < 512; i++) { const x = (i / 511) * 2 - 1; curve[i] = Math.sign(x) * Math.pow(Math.abs(x), 0.4) }
      sh.curve = curve
      const bp = this.F('bandpass', 900, 2)
      lfo.connect(ld); ld.connect(o.frequency)
      g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(0.5, t + 0.02); g2.gain.setValueAtTime(0.5, t + 0.7); g2.gain.linearRampToValueAtTime(0, t + 0.95)
      o.connect(sh); sh.connect(bp); bp.connect(g2); g2.connect(this.bus)
      o.start(t); lfo.start(t); o.stop(t + 1); lfo.stop(t + 1)
      for (let k = 0; k < 14; k++) this._noise(t + k * 0.06 + Math.random() * 0.02, 0.05, 'bandpass', 1500 + Math.random() * 1500, 2, 0.35, 0.015)
    },
    seismic() {
      if (!this.ctx) return
      const t = this.ctx.currentTime
      this._tone(t, 48, 26, 0.9, 0.9)
      this._noise(t, 1.8, 'lowpass', 120, 0.7, 0.9, 0.5)
    },
    heartbeat() {
      if (!this.ctx) return
      const t = this.ctx.currentTime
      this._tone(t, 70, 40, 0.14, 0.75)
      this._tone(t + 0.17, 64, 38, 0.12, 0.5)
    },
    stabilize() {
      if (!this.ctx) return
      const c = this.ctx, t = c.currentTime
      for (const n of [this.drone, this.static, this.turb, this.klax]) n.gain.setTargetAtTime(0, t, 0.25)
      // the lock: a ratchet, then the bolt going home
      for (let k = 0; k < 6; k++) this._noise(t + k * 0.045, 0.02, 'bandpass', 2800, 3, 0.25, 0.006)
      this._tone(t + 0.3, 90, 38, 0.3, 1)
      this._ring(t + 0.3, [220, 587, 1033, 1660], 0.35, 0.45)
      this._noise(t + 0.3, 0.1, 'bandpass', 1200, 1, 0.6, 0.03)
      // and a warm chord, slowly
      for (const m of [50, 57, 62, 66, 69, 76]) {
        const f = 440 * Math.pow(2, (m - 69) / 12)
        for (const [type, det, v] of [['triangle', -5, 0.045], ['sine', 5, 0.05]]) {
          const o = this.O(type, f), g2 = this.G(0), lp = this.F('lowpass', 1400, 0.7)
          o.detune.value = det
          g2.gain.setValueAtTime(0, t + 0.6)
          g2.gain.linearRampToValueAtTime(v, t + 3)
          g2.gain.setTargetAtTime(0, t + 7, 2.5)
          o.connect(lp); lp.connect(g2); g2.connect(this.out)
          o.start(t + 0.6); o.stop(t + 18)
        }
      }
      setTimeout(() => { if (phase === 'stabilized' && this.ctx) this.ctx.suspend().catch(() => {}) }, 19000)
    },
    implode() {
      if (!this.ctx) return
      const t = this.ctx.currentTime
      // everything stops
      for (const n of [this.bus, this.out]) { n.gain.cancelScheduledValues(t); n.gain.setValueAtTime(0, t) }
      // then a hollow thud, sucked inward
      const comb = this.ctx.createDelay(0.05), fb = this.G(0.62), dst = this.G(1)
      comb.delayTime.value = 0.006
      dst.connect(this.last); dst.connect(comb); comb.connect(fb); fb.connect(comb); comb.connect(this.last)
      const suck = this._noise(t, 0.3, 'lowpass', 300, 0.7, 0.0001, 0.2, this.last)
      suck.frequency.exponentialRampToValueAtTime(2400, t + 0.22)
      this._tone(t + 0.08, 110, 30, 0.5, 1, 'sine', dst)
      this._noise(t + 0.08, 0.15, 'lowpass', 500, 0.7, 0.6, 0.05, dst)
      setTimeout(() => { if (phase === 'breached' && this.ctx) this.ctx.suspend().catch(() => {}) }, 2500)
    },
    silence() {
      if (!this.ctx) return
      const t = this.ctx.currentTime
      for (const n of [this.drone, this.static, this.turb, this.klax]) { n.gain.cancelScheduledValues(t); n.gain.setValueAtTime(0, t) }
      this.out.gain.setValueAtTime(0.9, t)
      this.bus.gain.setValueAtTime(1, t)
      this.ctx.suspend().catch(() => {})
    },
  }

  resize()
  window.addEventListener('resize', resize)
  requestAnimationFrame(frame)
})()
</script>
</body>
