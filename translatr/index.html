    <!-- Apply the saved theme, text size, motion and graphics settings before the first paint (no flash). -->
    <script>
      try {
        var t = localStorage.getItem('translatr-theme')
        if (t) document.documentElement.setAttribute('data-theme', t)
        var p = JSON.parse(localStorage.getItem('translatr-prefs') || 'null')
        if (p) {
          if (p.textScale) document.documentElement.style.setProperty('--text-scale', String(p.textScale))
          var reduce = p.motion === 'reduce' || (p.motion !== 'full' && matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.documentElement.setAttribute('data-motion', reduce ? 'reduce' : 'full')
        }
        // Light unless the player picked Dark (or Auto, which follows the device).
        var cm = (p && p.colorMode) || 'light'
        var mode = cm === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : cm
        document.documentElement.setAttribute('data-mode', mode)
        // Graphics: same rule as graphicsMode() in src/lib/settings.js.
        var g = p && p.graphics
        var weak = (navigator.deviceMemory || 8) <= 4 || (navigator.hardwareConcurrency || 8) <= 2
        var lite = g === 'lite' || (g !== 'full' && (weak || (p && p.slowDevice)))
        document.documentElement.setAttribute('data-perf', lite ? 'lite' : 'full')
      } catch (e) {}
    </script>
