<!doctype html>
<html lang="en" data-state="dormant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0908">
<title>As Long As You Stay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230a0908'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c9965c' stroke-width='1.6'/%3E%3C/svg%3E">
<script>
  // Before anything is drawn: a memory that has already been let go of is not coming back.
  try {
    if (localStorage.getItem('memory_erased') === 'true') document.documentElement.setAttribute('data-state', 'after')
  } catch (e) {}
</script>
<style>
  :root {
    --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --ink: #e9d8bf;
    --amber: 201, 150, 92;
    --amp-y: 130px;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a0908; }
  html { -webkit-text-size-adjust: 100%; touch-action: none; overscroll-behavior: none; }
  body {
    font-family: var(--serif);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #light { z-index: 0; }
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse 120% 100% at 50% 50%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.62) 100%);
  }
  #stage { position: fixed; inset: 0; z-index: 2; }
  #grain { z-index: 3; mix-blend-mode: screen; opacity: 0.075; }

  /* ---- the one thing you can touch */
  #memory-btn {
    --warm: 0;
    position: fixed; left: 50%; top: 50%;
    width: 130px; height: 130px; margin: -65px 0 0 -65px;
    border-radius: 50%;
    border: 1px solid rgba(var(--amber), calc(0.34 + 0.4 * var(--warm)));
    background:
      radial-gradient(circle at 50% 30%, rgba(255, 196, 128, calc(0.03 + 0.11 * var(--warm))), rgba(255, 196, 128, 0) 62%),
      radial-gradient(circle at 50% 50%, #16130f 0%, #100d0b 60%, #0b0908 100%);
    box-shadow:
      inset 0 2px 7px rgba(0, 0, 0, 0.85),
      inset 0 0 26px rgba(0, 0, 0, 0.55),
      inset 0 -1px 0 rgba(255, 214, 170, 0.05),
      0 0 0 7px rgba(var(--amber), calc(0.025 + 0.05 * var(--warm))),
      0 0 calc(18px + 48px * var(--warm)) rgba(255, 176, 92, calc(0.05 + 0.24 * var(--warm))),
      0 14px 34px rgba(0, 0, 0, 0.6);
    color: rgba(222, 186, 138, calc(0.62 + 0.28 * var(--warm)));
    font: 500 9.5px/1.55 var(--serif);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    touch-action: none;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    will-change: transform;
  }
  #memory-btn .label { display: block; padding-left: 0.3em; pointer-events: none; }
  #memory-btn:focus-visible { outline: 1px dashed rgba(var(--amber), 0.5); outline-offset: 7px; }

  #subtext {
    position: fixed; left: 50%; top: calc(50% + 65px + 30px);
    transform: translateX(-50%);
    width: min(34ch, 84vw);
    text-align: center;
    font-size: 13.5px; line-height: 1.6; font-style: italic;
    color: rgba(214, 196, 172, 0.42);
    transition: opacity 1.6s ease;
  }
  #prompts { position: fixed; left: 0; right: 0; height: 0; bottom: calc(50% + 65px + var(--amp-y) + 30px); }
  .prompt {
    position: absolute; left: 50%; bottom: 0;
    width: min(30ch, 88vw);
    text-align: center;
    font-size: clamp(19px, 1rem + 0.9vw, 28px); line-height: 1.45; font-style: italic;
    color: #ead9c0;
    text-shadow: 0 0 22px rgba(255, 176, 92, 0.22);
    opacity: 0; filter: blur(5px); transform: translate(-50%, 10px);
    transition: opacity 1.25s ease, filter 1.25s ease, transform 1.8s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .prompt.show { opacity: 0.92; filter: blur(0); transform: translate(-50%, 0); }
  .prompt.gone { opacity: 0; filter: blur(4px); transform: translate(-50%, -6px); }

  #aftermath {
    position: fixed; inset: 0;
    display: none; place-content: center; gap: 0.3em;
    padding: 24px; text-align: center;
    font-size: clamp(15px, 0.9rem + 0.35vw, 19px); line-height: 1.75; letter-spacing: 0.01em;
    color: #6f6a64;
    opacity: 0;
    transition: opacity 3.6s ease 0.2s;
  }
  #aftermath.shown { opacity: 1; }

  /* ---- holding */
  html[data-state="holding"] #subtext { opacity: 0; }
  html[data-state="holding"] #memory-btn { cursor: grabbing; }

  /* ---- let go: pitch black at once, and then only the record of it */
  html[data-state="dark"], html[data-state="dark"] body,
  html[data-state="after"], html[data-state="after"] body { background: #050505; }
  html[data-state="dark"] #light, html[data-state="dark"] .vignette, html[data-state="dark"] #grain,
  html[data-state="dark"] #prompts, html[data-state="dark"] #subtext, html[data-state="dark"] #memory-btn,
  html[data-state="after"] #light, html[data-state="after"] .vignette, html[data-state="after"] #prompts,
  html[data-state="after"] #subtext, html[data-state="after"] #memory-btn { display: none !important; }
  html[data-state="dark"], html[data-state="dark"] * { cursor: none !important; }
  html[data-state="after"] #grain { opacity: 0.03; }
  html[data-state="after"] #aftermath { display: grid; }

  /* ---- the hidden reset: everything comes back slowly */
  html.resetting, html.resetting body { transition: background-color 1.8s ease; }
  html.resetting #aftermath { transition: opacity 0.9s ease; }
  .arrive { animation: arrive 1.8s ease both; }
  @keyframes arrive { from { opacity: 0; } }

  @media (max-height: 520px) {
    .prompt { font-size: 17px; }
    #subtext { font-size: 12.5px; top: calc(50% + 65px + 16px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .prompt, .prompt.show, .prompt.gone { transform: translate(-50%, 0); filter: none; }
  }
  .noscript { position: fixed; inset: auto 0 12% 0; text-align: center; font-style: italic; color: #6f6a64; z-index: 4; }
</style>
</head>
<body>
<canvas id="light" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<main id="stage">
  <div id="prompts" aria-live="polite"><p class="prompt"></p><p class="prompt"></p></div>
  <button id="memory-btn" type="button" aria-label="Hold to remember. Press and keep holding."><span class="label">Hold to<br>remember</span></button>
  <p id="subtext">This memory is stored locally on this machine. It stays only as long as you hold it.</p>
  <div id="aftermath" role="status" aria-live="polite"><p></p><p></p><p></p></div>
</main>
<canvas id="grain" aria-hidden="true"></canvas>
<noscript><p class="noscript">This memory needs JavaScript to be held.</p></noscript>
<script>
;(function () {
  'use strict'

  // ═════════════════════ The shape of it
  const RADIUS = 65 // the button is 130 px across
  const WARM = 25 // seconds of warmth before it starts to slip
  const SLIP = 2.5 // seconds your hand can be off it before it is gone
  const DARK = 4 // seconds of nothing after you let go
  const FIRST_BEAT = 0.45 // the tape is up to speed and the music starts (seconds after the press)
  const PROMPT_IN = 1.25
  const PROMPT_STAY = 5
  const PROMPTS = [
    [2, 'Picture a room you used to know by heart in the dark.'],
    [10, 'The murmur of voices through a wall while you were falling asleep.'],
    [18, 'An afternoon where nobody needed you to be anywhere at all.'],
    [26, 'Your hand is getting tired. Nothing is effortless to hold forever.'],
    [36, 'It is starting to slip. Stay with it just a little longer.'],
    [48, 'A day you didn’t realize was the last time.'],
    [60, 'Nothing stays forever. Let go when you are ready.'],
  ]
  const KEYS = ['memory_erased', 'held_duration', 'released_timestamp']
  const TAU = Math.PI * 2

  const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v)
  const smooth = (x) => x * x * (3 - 2 * x)
  const easeOut = (x) => 1 - Math.pow(1 - x, 3)
  const bell = (x, mu, s) => Math.exp(-0.5 * Math.pow((x - mu) / s, 2))

  // ═════════════════════ The page
  const root = document.documentElement
  const btn = document.getElementById('memory-btn')
  const stage = document.getElementById('stage')
  const subtext = document.getElementById('subtext')
  const promptBox = document.getElementById('prompts')
  const promptEls = Array.prototype.slice.call(promptBox.children)
  const afterEl = document.getElementById('aftermath')
  const lightCanvas = document.getElementById('light')
  const grainCanvas = document.getElementById('grain')
  const reduced = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false }

  // localStorage, or (if this browser won't keep it) at least this visit
  const memo = {}
  const store = {
    get(k) {
      try {
        const v = localStorage.getItem(k)
        return v === null ? (k in memo ? memo[k] : null) : v
      } catch (e) {
        return k in memo ? memo[k] : null
      }
    },
    set(k, v) {
      memo[k] = v
      try { localStorage.setItem(k, v) } catch (e) {}
    },
    remove(k) {
      delete memo[k]
      try { localStorage.removeItem(k) } catch (e) {}
    },
  }

  // ═════════════════════ State
  let state = root.getAttribute('data-state') === 'after' ? 'after' : 'dormant'
  let pointerId = null
  let holdStart = 0
  let px = 0, py = 0 // where the hand is
  let bx = 0, by = 0 // where the button is
  let driftClock = 0
  let decay = 0 // eased decayFactor (for sound and light)
  let offSince = 0
  let shown = -1 // the last prompt shown
  let slot = 0
  const promptOf = []
  let darkTimer = 0
  let audioAt = 0
  let flickerUntil = 0
  let W = 0, H = 0, ampX = 180, ampY = 130

  function layout() {
    W = window.innerWidth
    H = window.innerHeight
    ampX = clamp(W / 2 - RADIUS - 18, 20, 180)
    ampY = clamp(H / 2 - RADIUS - 190, 20, 130) // (the words above need their room)
    root.style.setProperty('--amp-y', Math.round(ampY) + 'px')
    if (!bx) { bx = W / 2; by = H / 2 }
    light.resize()
    grain.resize()
  }

  // ═════════════════════ Holding on
  btn.addEventListener('pointerdown', (e) => {
    if (state !== 'dormant' || (e.pointerType === 'mouse' && e.button !== 0)) return
    e.preventDefault()
    pointerId = e.pointerId
    try { btn.setPointerCapture(e.pointerId) } catch (err) {}
    px = e.clientX
    py = e.clientY
    begin()
  })
  window.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pointerId) return
    px = e.clientX
    py = e.clientY
  }, { passive: true })
  window.addEventListener('pointerup', (e) => { if (e.pointerId === pointerId) release() })
  window.addEventListener('pointercancel', (e) => { if (e.pointerId === pointerId) release() })
  btn.addEventListener('lostpointercapture', (e) => { if (e.pointerId === pointerId) release() })
  // leaving the page is letting go too
  window.addEventListener('blur', () => release())
  document.addEventListener('visibilitychange', () => { if (document.hidden) release() })
  for (const ev of ['contextmenu', 'selectstart', 'dragstart', 'gesturestart']) document.addEventListener(ev, (e) => e.preventDefault())

  function begin() {
    state = 'holding'
    root.setAttribute('data-state', 'holding')
    holdStart = performance.now()
    driftClock = 0
    decay = 0
    offSince = 0
    shown = -1
    sound.start()
  }

  function hold(now, dt) {
    const t = (now - holdStart) / 1000

    // the words: in, five seconds, out (the last one stays)
    while (shown + 1 < PROMPTS.length && t >= PROMPTS[shown + 1][0]) showPrompt(shown + 1)
    for (let i = 0; i < PROMPTS.length - 1; i++) {
      const el = promptOf[i]
      if (el && el.classList.contains('show') && t >= PROMPTS[i][0] + PROMPT_IN + PROMPT_STAY) {
        el.classList.remove('show')
        el.classList.add('gone')
      }
    }

    // after twenty-five seconds it starts to drift away from you, and to tremble
    let ox = 0, oy = 0, decayRaw = 0
    if (t > WARM) {
      const since = t - WARM
      const k = smooth(clamp(since / 12))
      driftClock += dt * (1 + Math.min(0.6, since / 90)) // and it quickens, slowly
      const c = driftClock
      ox = ampX * k * (0.56 * Math.sin(0.23 * c + 0.4) + 0.29 * Math.sin(0.41 * c + 2.1) + 0.15 * Math.sin(0.97 * c + 4.3))
      oy = ampY * k * (0.52 * Math.cos(0.19 * c + 1.2) + 0.33 * Math.sin(0.37 * c + 0.7) + 0.15 * Math.cos(0.89 * c + 3.1))
      const tr = reduced.matches ? 0 : (0.35 + 1.4 * k) * (1 + 1.2 * decay)
      ox += tr * (0.5 * Math.sin(t * 7.3) + 0.3 * Math.sin(t * 11.9 + 1.3) + 0.2 * Math.sin(t * 17.3 + 2.1))
      oy += tr * (0.5 * Math.cos(t * 6.7) + 0.3 * Math.sin(t * 13.1 + 0.4) + 0.2 * Math.cos(t * 19.7 + 1.7))
      bx = W / 2 + ox
      by = H / 2 + oy
      // how far your hand is from it: 0 at its heart, 1 once you are off its edge
      const dist = Math.hypot(px - bx, py - by)
      const inner = RADIUS * 0.35
      decayRaw = smooth(clamp((dist - inner) / (RADIUS - inner)))
      if (decayRaw > 0.95) {
        if (!offSince) offSince = now
        else if (now - offSince > SLIP * 1000) return release() // it slipped out of your grasp
      } else offSince = 0
    } else {
      bx = W / 2
      by = H / 2
    }
    decay += (decayRaw - decay) * (1 - Math.exp(-dt / 0.18))

    // a resting heartbeat, sixty to the minute, in time with the music
    const beat = t - FIRST_BEAT
    const ph = beat > 0 ? beat % 1 : 0.5
    const pulse = beat > 0 ? 0.03 * bell(ph, 0.04, 0.05) + 0.016 * bell(ph, 0.26, 0.06) : 0
    const press = 1 - 0.035 * Math.exp(-t / 0.09)
    const scale = press * (1 + (reduced.matches ? 0.4 : 1) * pulse)
    btn.style.transform = 'translate3d(' + ox.toFixed(2) + 'px,' + oy.toFixed(2) + 'px,0) scale(' + scale.toFixed(4) + ')'
    btn.style.setProperty('--warm', (smooth(clamp(t / 1.6)) * (1 - 0.72 * decay) * (0.9 + 3 * pulse)).toFixed(3))
    promptBox.style.opacity = (1 - 0.38 * decay).toFixed(3)
    promptBox.style.filter = decay > 0.02 ? 'blur(' + (decay * 1.6).toFixed(2) + 'px)' : ''

    // the light: it opens out behind the button, and pulls back in as the memory goes
    const flicker = now < flickerUntil ? 0.55 : 1
    light.target.i = easeOut(clamp(t / 4)) * (1 - 0.86 * decay) * (1 + 0.6 * pulse) * flicker
    light.target.r = (0.18 + 0.82 * easeOut(clamp(t / 6))) * Math.hypot(W, H) * 0.62 * (1 - 0.6 * decay)
    grain.level = 0.075 + 0.05 * decay

    // the sound follows, twenty times a second
    if (t > WARM && now - audioAt > 50) {
      audioAt = now
      const drop = sound.decay(decay)
      if (drop) flickerUntil = now + drop * 1000
    }
  }

  function showPrompt(i) {
    shown = i
    const el = promptEls[slot]
    slot = 1 - slot
    for (let j = 0; j < promptOf.length; j++) if (promptOf[j] === el) promptOf[j] = null
    promptOf[i] = el
    el.textContent = PROMPTS[i][1]
    el.classList.remove('gone', 'show')
    void el.offsetWidth
    el.classList.add('show')
  }

  // ═════════════════════ Letting go
  function release() {
    if (state !== 'holding') return
    state = 'dark'
    const held = performance.now() - holdStart
    // written now, not after the dark: reloading in the dark doesn't bring it back
    store.set('memory_erased', 'true')
    store.set('held_duration', duration(held))
    store.set('released_timestamp', clock(new Date()))
    sound.snap()
    root.setAttribute('data-state', 'dark')
    const id = pointerId
    pointerId = null
    try { if (id != null && btn.hasPointerCapture && btn.hasPointerCapture(id)) btn.releasePointerCapture(id) } catch (e) {}
    btn.remove()
    clearPrompts()
    darkTimer = setTimeout(aftermath, DARK * 1000)
  }

  function aftermath() {
    state = 'after'
    root.setAttribute('data-state', 'after')
    if (btn.parentNode) btn.remove()
    const held = store.get('held_duration')
    const at = store.get('released_timestamp')
    const lines = afterEl.children
    lines[0].textContent = held ? 'Held for ' + held + '.' : 'Held for a while.'
    lines[1].textContent = at ? 'Released at ' + at + '.' : 'Released some time ago.'
    lines[2].textContent = 'The archive on this machine is now empty.'
    afterEl.classList.remove('shown')
    requestAnimationFrame(() => requestAnimationFrame(() => afterEl.classList.add('shown')))
  }

  function duration(ms) {
    const s = Math.floor(ms / 1000)
    if (s < 1) return 'less than a second'
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60
    const parts = []
    if (h) parts.push(h + (h === 1 ? ' hour' : ' hours'))
    if (m) parts.push(m + (m === 1 ? ' minute' : ' minutes'))
    if (sec || !parts.length) parts.push(sec + (sec === 1 ? ' second' : ' seconds'))
    return parts.join(', ')
  }
  function clock(d) {
    try {
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
    } catch (e) {
      const h = d.getHours()
      return ((h + 11) % 12) + 1 + ':' + String(d.getMinutes()).padStart(2, '0') + (h < 12 ? ' AM' : ' PM')
    }
  }

  function clearPrompts() {
    for (const el of promptEls) {
      el.classList.remove('show', 'gone')
      el.textContent = ''
    }
    promptOf.length = 0
    promptBox.style.opacity = ''
    promptBox.style.filter = ''
  }

  // ═════════════════════ The hidden reset: Escape three times within a second and a half
  const escapes = []
  window.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || e.repeat) return
    const now = performance.now()
    escapes.push(now)
    while (escapes.length && now - escapes[0] > 1500) escapes.shift()
    if (escapes.length >= 3) {
      escapes.length = 0
      reset()
    }
  })

  function reset() {
    if (state === 'resetting') return
    // only this piece's own keys: the rest of the site keeps what it has saved here
    for (const k of KEYS) store.remove(k)
    clearTimeout(darkTimer)
    const from = state
    if (from === 'holding') {
      const id = pointerId
      pointerId = null
      try { if (id != null) btn.releasePointerCapture(id) } catch (e) {}
      sound.silence()
    }
    state = 'resetting'
    root.classList.add('resetting')
    afterEl.classList.remove('shown')
    setTimeout(() => {
      clearPrompts()
      afterEl.style.display = ''
      btn.style.transform = ''
      btn.style.setProperty('--warm', '0')
      if (!btn.parentNode) stage.insertBefore(btn, subtext)
      root.setAttribute('data-state', 'dormant')
      bx = W / 2
      by = H / 2
      light.target.i = 0
      for (const el of [btn, subtext, lightCanvas, grainCanvas]) {
        el.classList.remove('arrive')
        void el.offsetWidth
        el.classList.add('arrive')
      }
      setTimeout(() => {
        root.classList.remove('resetting')
        for (const el of [btn, subtext, lightCanvas, grainCanvas]) el.classList.remove('arrive')
        state = 'dormant'
      }, 1900)
    }, from === 'after' ? 950 : 350)
  }

  // ═════════════════════ Light: the golden-hour bloom and the dust it catches
  const light = {
    g: lightCanvas.getContext('2d'),
    motes: [],
    sprite: null,
    i: 0,
    r: 0,
    x: 0,
    y: 0,
    target: { i: 0, r: 0 },
    resize() {
      const dpr = Math.min(1.5, window.devicePixelRatio || 1)
      lightCanvas.width = Math.round(W * dpr)
      lightCanvas.height = Math.round(H * dpr)
      this.g.setTransform(dpr, 0, 0, dpr, 0, 0)
      const want = Math.round(clamp((W * H) / 8000, 70, 200))
      while (this.motes.length < want) {
        this.motes.push({
          x: Math.random() * W, y: Math.random() * H,
          z: 0.25 + Math.random() * 0.75, s: 0.5 + Math.random() * 1.4,
          vx: (Math.random() - 0.5) * 6, vy: -1 - Math.random() * 3.5,
          ph: Math.random() * TAU, tw: 0.6 + Math.random() * 1.6,
        })
      }
      this.motes.length = want
      if (!this.x) { this.x = W / 2; this.y = H / 2 }
      if (!this.sprite) {
        const c = document.createElement('canvas')
        c.width = c.height = 48
        const g = c.getContext('2d')
        const gr = g.createRadialGradient(24, 24, 0, 24, 24, 24)
        gr.addColorStop(0, 'rgba(255, 240, 210, 1)')
        gr.addColorStop(0.25, 'rgba(255, 214, 150, 0.65)')
        gr.addColorStop(0.6, 'rgba(255, 180, 100, 0.15)')
        gr.addColorStop(1, 'rgba(255, 170, 90, 0)')
        g.fillStyle = gr
        g.fillRect(0, 0, 48, 48)
        this.sprite = c
      }
    },
    draw(now, dt) {
      const g = this.g
      this.i += (this.target.i - this.i) * (1 - Math.exp(-dt / 0.35))
      this.r += (this.target.r - this.r) * (1 - Math.exp(-dt / 0.6))
      this.x += (bx - this.x) * (1 - Math.exp(-dt / 0.08))
      this.y += (by - this.y) * (1 - Math.exp(-dt / 0.08))
      g.clearRect(0, 0, W, H)
      const I = this.i
      if (I > 0.003) {
        // the whole room warms a little
        g.fillStyle = 'rgba(255, 168, 88, ' + (0.04 * I).toFixed(4) + ')'
        g.fillRect(0, 0, W, H)
        // a light leak at the edge of the frame, drifting
        const lx = W * (0.08 + 0.05 * Math.sin(now * 0.00007)), ly = H * (0.12 + 0.06 * Math.cos(now * 0.00005))
        const leak = g.createRadialGradient(lx, ly, 0, lx, ly, Math.max(W, H) * 0.55)
        leak.addColorStop(0, 'rgba(255, 150, 70, ' + (0.07 * I).toFixed(4) + ')')
        leak.addColorStop(1, 'rgba(255, 150, 70, 0)')
        g.fillStyle = leak
        g.fillRect(0, 0, W, H)
        // and the bloom behind the button
        const R = Math.max(1, this.r)
        const b = g.createRadialGradient(this.x, this.y, 0, this.x, this.y, R)
        b.addColorStop(0, 'rgba(255, 198, 124, ' + (0.46 * I).toFixed(4) + ')')
        b.addColorStop(0.16, 'rgba(255, 180, 95, ' + (0.3 * I).toFixed(4) + ')')
        b.addColorStop(0.42, 'rgba(255, 172, 88, ' + (0.11 * I).toFixed(4) + ')')
        b.addColorStop(0.72, 'rgba(255, 160, 80, ' + (0.035 * I).toFixed(4) + ')')
        b.addColorStop(1, 'rgba(255, 160, 80, 0)')
        g.fillStyle = b
        g.fillRect(0, 0, W, H)
      }
      // dust in the air, lit where the light reaches it
      g.globalCompositeOperation = 'lighter'
      const R2 = Math.max(1, this.r * this.r * 0.3)
      const sp = reduced.matches ? 0.4 : 1
      for (const m of this.motes) {
        m.x += (m.vx + Math.sin(now * 0.00023 * m.tw + m.ph) * 4) * dt * sp
        m.y += (m.vy + Math.cos(now * 0.00019 * m.tw + m.ph) * 2.5) * dt * sp
        if (m.x < -8) m.x += W + 16
        else if (m.x > W + 8) m.x -= W + 16
        if (m.y < -8) m.y += H + 16
        else if (m.y > H + 8) m.y -= H + 16
        const dx = m.x - this.x, dy = m.y - this.y
        const lit = I * Math.exp(-(dx * dx + dy * dy) / R2)
        const a = (0.02 + 0.9 * lit) * m.z * (0.72 + 0.28 * Math.sin(now * 0.0011 * m.tw + m.ph))
        if (a < 0.008) continue
        const s = m.s * (0.6 + 0.7 * m.z) * (1 + 1.2 * lit) * 3
        g.globalAlpha = a > 1 ? 1 : a
        g.drawImage(this.sprite, m.x - s, m.y - s, s * 2, s * 2)
      }
      g.globalAlpha = 1
      g.globalCompositeOperation = 'source-over'
    },
  }

  // ═════════════════════ Film grain, twenty-four frames a second
  const grain = {
    g: grainCanvas.getContext('2d'),
    tiles: [],
    last: 0,
    level: 0.075,
    resize() {
      grainCanvas.width = Math.ceil(W / 1.3)
      grainCanvas.height = Math.ceil(H / 1.3)
      if (this.tiles.length) return
      for (let k = 0; k < 6; k++) {
        const c = document.createElement('canvas')
        c.width = c.height = 128
        const tg = c.getContext('2d')
        const img = tg.createImageData(128, 128)
        const d = img.data
        for (let i = 0; i < d.length; i += 4) {
          const n = (Math.random() + Math.random() + Math.random() + Math.random() - 2) / 2
          const v = clamp(0.32 + n * 0.55) * 255
          d[i] = v
          d[i + 1] = v * 0.96
          d[i + 2] = v * 0.9
          d[i + 3] = 255
        }
        tg.putImageData(img, 0, 0)
        this.tiles.push(this.g.createPattern(c, 'repeat'))
      }
    },
    draw(now) {
      if (now - this.last < 1000 / (reduced.matches ? 12 : 24)) return
      this.last = now
      const g = this.g
      const w = grainCanvas.width, h = grainCanvas.height
      g.setTransform(1, 0, 0, 1, -Math.random() * 128, -Math.random() * 128)
      g.fillStyle = this.tiles[(Math.random() * this.tiles.length) | 0]
      g.fillRect(0, 0, w + 128, h + 128)
      g.setTransform(1, 0, 0, 1, 0, 0)
      // now and then a fleck of dust or a hair on the film
      if (Math.random() < 0.08) {
        const x = Math.random() * w, y = Math.random() * h
        g.fillStyle = 'rgba(255, 255, 255, 0.9)'
        g.strokeStyle = 'rgba(255, 255, 255, 0.7)'
        g.lineWidth = 0.7
        g.beginPath()
        if (Math.random() < 0.7) {
          g.arc(x, y, 0.6 + Math.random() * 1.6, 0, TAU)
          g.fill()
        } else {
          g.moveTo(x, y)
          g.quadraticCurveTo(x + (Math.random() - 0.5) * 28, y + (Math.random() - 0.5) * 28, x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 48)
          g.stroke()
        }
      }
      if (state !== 'after') grainCanvas.style.opacity = (this.level * (0.92 + Math.random() * 0.16)).toFixed(3)
      else grainCanvas.style.opacity = ''
    },
  }

  // ═════════════════════ Sound: all of it made here, as it plays
  /*<engine>*/
  const MIDI = (m) => 440 * Math.pow(2, (m - 69) / 12)
  // Fmaj7 → Em7 → Dm7 → Cmaj7, a bar each at sixty beats a minute; the electric piano plays the 9ths on top
  const CHORDS = [
    { bass: 41, pad: [53, 57, 60, 64], keys: [57, 60, 64, 67] },
    { bass: 40, pad: [52, 55, 59, 62], keys: [55, 59, 62, 66] },
    { bass: 38, pad: [50, 53, 57, 60], keys: [53, 57, 60, 64] },
    { bass: 36, pad: [48, 52, 55, 59], keys: [52, 55, 59, 62] },
  ]
  // two phrases that answer each other; the first time round there is no tune at all
  const PHRASES = [
    [[1, 76], [2.5, 74], [3, 72], [5, 71], [7, 74], [9, 69], [10, 72], [11.5, 76], [13, 74], [14.5, 67]],
    [[1.5, 79], [3.5, 76], [5.5, 78], [7.5, 74], [9.5, 76], [11.5, 72], [13.5, 74], [15, 71]],
  ]
  const HISS = 0.03

  /** Noise for the hiss, the rumble, the crackle and the deck. make(channels, frames, rate) → AudioBuffer */
  function bake(make, rate) {
    const loop = (secs, channels, gen) => {
      const n = Math.round(secs * rate), x = Math.round(0.05 * rate)
      const b = make(channels, n, rate)
      for (let c = 0; c < channels; c++) {
        const raw = new Float32Array(n + x)
        gen(raw)
        for (let i = 0; i < x; i++) { const a = i / x; raw[i] = raw[i] * a + raw[n + i] * (1 - a) } // no seam in the loop
        b.getChannelData(c).set(raw.subarray(0, n))
      }
      return b
    }
    const white = loop(1, 1, (d) => { for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1 })
    const hiss = loop(9.7, 2, (d) => {
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0
      for (let i = 0; i < d.length; i++) {
        const w = Math.random() * 2 - 1
        b0 = 0.99886 * b0 + w * 0.0555179
        b1 = 0.99332 * b1 + w * 0.0750759
        b2 = 0.969 * b2 + w * 0.153852
        b3 = 0.8665 * b3 + w * 0.3104856
        b4 = 0.55 * b4 + w * 0.5329522
        b5 = -0.7616 * b5 - w * 0.016898
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11
        b6 = w * 0.115926
      }
    })
    const brown = loop(6.3, 1, (d) => {
      let y = 0
      for (let i = 0; i < d.length; i++) { y = (y + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = y * 3.5 }
    })
    const pops = []
    for (let k = 0; k < 12; k++) {
      const n = Math.max(8, Math.round((0.002 + Math.random() * 0.004) * rate))
      const b = make(1, n, rate), d = b.getChannelData(0)
      const tau = (0.00008 + Math.random() * 0.0006) * rate, pol = Math.random() < 0.5 ? -1 : 1
      for (let i = 0; i < n; i++) d[i] = pol * Math.exp(-i / tau) * (i < 3 ? 1 : 0.55 + Math.random() * 0.45) * (i % 2 && i < 12 ? -0.6 : 1)
      pops.push(b)
    }
    return { white, hiss, brown, pops }
  }

  /** A hall to play it in: 4.6 seconds of tail that darkens as it dies away. */
  function hall(ctx) {
    const rate = ctx.sampleRate, len = Math.round(4.6 * rate), pre = Math.round(0.019 * rate)
    const b = ctx.createBuffer(2, len, rate)
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c)
      let lp = 0
      for (let i = pre; i < len; i++) {
        const t = (i - pre) / rate
        const env = Math.exp(-t * 1.5) * (1 - Math.exp(-t * 45))
        const k = 0.6 * Math.exp(-t * 0.85) + 0.05
        lp += k * (Math.random() * 2 - 1 - lp)
        d[i] = lp * env
      }
      for (const [ms, a] of [[11, 0.42], [17, -0.3], [26, 0.24], [38, -0.18], [55, 0.13], [71, -0.09]]) {
        const j = pre + Math.round(((ms + c * 2.7) / 1000) * rate)
        if (j < len) d[j] += a * 0.5
      }
    }
    return b
  }

  function constant(ctx, value) {
    if (ctx.createConstantSource) {
      const n = ctx.createConstantSource()
      n.offset.value = value
      return n
    }
    const b = ctx.createBuffer(1, 128, ctx.sampleRate)
    b.getChannelData(0).fill(1)
    const s = ctx.createBufferSource()
    s.buffer = b
    s.loop = true
    const g = ctx.createGain()
    g.gain.value = value
    s.connect(g)
    return {
      offset: g.gain,
      connect: (n) => g.connect(n),
      disconnect: () => g.disconnect(),
      start: (t) => s.start(t),
      stop: (t) => s.stop(t),
      set onended(f) { s.onended = f },
    }
  }

  function softClip(drive) {
    const n = 1024, c = new Float32Array(n), k = Math.tanh(drive)
    for (let i = 0; i < n; i++) c[i] = Math.tanh(drive * ((i / (n - 1)) * 2 - 1)) / k
    return c
  }

  /** One hold's worth of sound: the deck, the record's crackle, the music, the tape it's on. */
  function Engine(ctx, bank, out) {
    const live = new Set()
    const gain = (v) => { const n = ctx.createGain(); n.gain.value = v; return n }
    const filter = (type, f, q, db) => {
      const n = ctx.createBiquadFilter()
      n.type = type
      n.frequency.value = f
      if (q != null) n.Q.value = q
      if (db != null) n.gain.value = db
      return n
    }
    const osc = (type, f) => { const n = ctx.createOscillator(); n.type = type; n.frequency.value = f; return n }
    const source = (buffer, loop) => { const s = ctx.createBufferSource(); s.buffer = buffer; s.loop = !!loop; return s }
    function play(src, at, until, offset) {
      live.add(src)
      src.onended = () => {
        live.delete(src)
        if (src._bent) try { pitch.disconnect(src.detune) } catch (e) {}
      }
      if (offset != null) src.start(at, offset)
      else src.start(at)
      if (until != null) src.stop(until)
      return src
    }
    const bend = (o) => { pitch.connect(o.detune); o._bent = true } // every oscillator follows the tape's speed

    // ---- out: a gentle compressor; the deck's own clicks skip the music's fate
    const master = gain(0.9)
    const comp = ctx.createDynamicsCompressor()
    comp.threshold.value = -14
    comp.knee.value = 12
    comp.ratio.value = 2.5
    comp.attack.value = 0.006
    comp.release.value = 0.28
    master.connect(comp)
    comp.connect(out)
    const fx = gain(1)
    fx.connect(master)

    // ---- the tape: one pitch signal (in cents) into every oscillator, plus wow and flutter on the whole mix
    const pitch = gain(1)
    const drag = constant(ctx, 0)
    drag.connect(pitch)
    const warble = [[0.83, 3, 'sine'], [1.31, 1.5, 'triangle'], [0.071, 4, 'sine']].map(([f, depth, type]) => {
      const o = osc(type, f), d = gain(depth)
      o.connect(d)
      d.connect(pitch)
      return { o, d }
    })
    const musicIn = gain(1)
    const tape = ctx.createDelay(0.25)
    tape.delayTime.value = 0.03
    const wow = osc('sine', 0.52), wowD = gain(0.0011)
    const flut = osc('sine', 6.3), flutD = gain(0.00007)
    wow.connect(wowD)
    wowD.connect(tape.delayTime)
    flut.connect(flutD)
    flutD.connect(tape.delayTime)
    const warmth = filter('lowshelf', 200, 0.7, 2.5)
    const air = filter('highshelf', 6000, 0.7, -6)
    const tone = filter('lowpass', 5200, 0.55)
    const shaper = ctx.createWaveShaper()
    shaper.curve = softClip(1.6)
    shaper.oversample = '2x'
    musicIn.connect(tape)
    tape.connect(warmth)
    warmth.connect(air)
    air.connect(tone)
    tone.connect(shaper)
    const musicOut = gain(0.95), drop = gain(1)
    const dry = gain(0.8)
    shaper.connect(dry)
    dry.connect(musicOut)
    // a ping-pong echo, darker each time round
    const send = gain(0.26), dl = ctx.createDelay(2), dr = ctx.createDelay(2)
    dl.delayTime.value = 0.75
    dr.delayTime.value = 0.75
    const fbL = gain(0.4), fbR = gain(0.4), echoTone = filter('lowpass', 2300, 0.5), merge = ctx.createChannelMerger(2), echo = gain(0.55)
    shaper.connect(send)
    send.connect(dl)
    dl.connect(echoTone)
    echoTone.connect(fbR)
    fbR.connect(dr)
    dr.connect(fbL)
    fbL.connect(dl)
    dl.connect(merge, 0, 0)
    dr.connect(merge, 0, 1)
    merge.connect(echo)
    echo.connect(musicOut)
    // and the hall
    const verb = ctx.createConvolver(), vsend = gain(0.55), vret = gain(0.62)
    shaper.connect(vsend)
    echo.connect(vsend)
    vsend.connect(verb)
    verb.connect(vret)
    vret.connect(musicOut)
    musicOut.connect(drop)
    drop.connect(master)

    // ---- the instruments' busses
    const epBus = gain(1), trem = gain(0.94), tremLfo = osc('sine', 4.4), tremD = gain(0.06)
    tremLfo.connect(tremD)
    tremD.connect(trem.gain)
    epBus.connect(trem)
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null
    const panLfo = osc('sine', 0.13), panD = gain(0.32)
    if (pan) {
      panLfo.connect(panD)
      panD.connect(pan.pan)
      trem.connect(pan)
      pan.connect(musicIn)
    } else trem.connect(musicIn)
    const padBus = gain(1), padTone = filter('lowpass', 1150, 0.9), padLfo = osc('sine', 0.09), padLfoD = gain(260)
    padLfo.connect(padLfoD)
    padLfoD.connect(padTone.frequency)
    padBus.connect(padTone)
    padTone.connect(musicIn)
    const vib = osc('sine', 4.9), vibD = gain(4)
    vib.connect(vibD)
    const bassBus = gain(1)
    bassBus.connect(musicIn)

    // ---- the record: hiss, rumble, crackle
    const crackle = gain(1)
    crackle.connect(master)
    const hissSrc = source(bank.hiss, true), hissLow = filter('highpass', 110, 0.5), hissTone = filter('lowpass', 4800, 0.5), hissG = gain(0)
    hissSrc.connect(hissLow)
    hissLow.connect(hissTone)
    hissTone.connect(hissG)
    hissG.connect(crackle)
    const rpm = osc('sine', 0.5556), rpmD = gain(0) // 33⅓ turns a minute: the swish of each one
    rpm.connect(rpmD)
    rpmD.connect(hissG.gain)
    const rumble = source(bank.brown, true), rumbleTone = filter('lowpass', 140, 0.7), rumbleG = gain(0)
    rumble.connect(rumbleTone)
    rumbleTone.connect(rumbleG)
    rumbleG.connect(crackle)
    const popBus = gain(0)
    popBus.connect(crackle)

    // ---- instruments
    function keys(at, m, vel, len) {
      // an electric piano: FM with a bright strike that mellows, and a tine's short ping
      const f = MIDI(m)
      const car = osc('sine', f), mod = osc('sine', f), tine = osc('sine', Math.min(f * 14, 10000))
      const index = gain(0)
      index.gain.setValueAtTime(f * (1.1 + 2.4 * vel), at)
      index.gain.exponentialRampToValueAtTime(f * 0.12, at + 0.7 + len * 0.1)
      mod.connect(index)
      index.connect(car.frequency)
      const amp = gain(0)
      amp.gain.setValueAtTime(0, at)
      amp.gain.linearRampToValueAtTime(0.2 * vel, at + 0.004)
      amp.gain.setTargetAtTime(0.11 * vel, at + 0.004, 0.18)
      amp.gain.setTargetAtTime(0, at + 0.4, len / 4.5)
      const ping = gain(0)
      ping.gain.setValueAtTime(0.05 * vel, at)
      ping.gain.exponentialRampToValueAtTime(0.0001, at + 0.07)
      car.connect(amp)
      amp.connect(epBus)
      tine.connect(ping)
      ping.connect(epBus)
      for (const o of [car, mod, tine]) {
        bend(o)
        play(o, at, at + len + 0.6)
      }
    }
    function pad(at, notes, len, vel) {
      for (const m of notes) {
        const f = MIDI(m)
        for (const [type, cents, lvl] of [['triangle', -7, 0.024], ['sine', 6, 0.03], ['sawtooth', 2, 0.0055]]) {
          const o = osc(type, f)
          o.detune.value = cents
          const a = gain(0)
          a.gain.setValueAtTime(0, at)
          a.gain.linearRampToValueAtTime(lvl * vel, at + 1.7)
          a.gain.setValueAtTime(lvl * vel, at + len)
          a.gain.linearRampToValueAtTime(0, at + len + 2.4)
          o.connect(a)
          a.connect(padBus)
          vibD.connect(o.detune)
          bend(o)
          play(o, at, at + len + 2.5)
        }
      }
    }
    function bass(at, m, len, vel) {
      const f = MIDI(m)
      const o = osc('sine', f), o2 = osc('triangle', f * 2), a = gain(0), a2 = gain(0.12)
      a.gain.setValueAtTime(0, at)
      a.gain.linearRampToValueAtTime(0.32 * vel, at + 0.05)
      a.gain.setTargetAtTime(0.22 * vel, at + 0.05, 0.6)
      a.gain.setTargetAtTime(0, at + len - 0.2, 0.35)
      o.connect(a)
      o2.connect(a2)
      a2.connect(a)
      a.connect(bassBus)
      for (const n of [o, o2]) {
        bend(n)
        play(n, at, at + len + 1.6)
      }
    }

    // ---- the deck itself
    function burst(at, len, type, f, q, peak, tau) {
      const s = source(bank.white), flt = filter(type, f, q), g = gain(0)
      g.gain.setValueAtTime(peak, at)
      g.gain.setTargetAtTime(0, at, tau)
      s.connect(flt)
      flt.connect(g)
      g.connect(fx)
      play(s, at, at + len + tau * 6, Math.random() * 0.9)
    }
    function thump(at, f0, f1, len, peak) {
      const o = osc('sine', f0), g = gain(0)
      o.frequency.setValueAtTime(f0, at)
      o.frequency.exponentialRampToValueAtTime(f1, at + len)
      g.gain.setValueAtTime(0, at)
      g.gain.linearRampToValueAtTime(peak, at + 0.004)
      g.gain.setTargetAtTime(0, at + 0.006, len / 3)
      o.connect(g)
      g.connect(fx)
      play(o, at, at + len * 2 + 0.05)
    }
    function ring(at, modes, len) {
      const s = source(bank.white), g = gain(0)
      g.gain.setValueAtTime(1, at)
      g.gain.setTargetAtTime(0, at, len / 3)
      s.connect(g)
      for (const [f, q, lvl] of modes) {
        const r = filter('bandpass', f, q), l = gain(lvl)
        g.connect(r)
        r.connect(l)
        l.connect(fx)
      }
      play(s, at, at + len + 0.05, Math.random() * 0.9)
    }
    /** PLAY going down: the key's clack, the plastic ringing, the heads going in, the motor taking up the tape. */
    function clunk(at) {
      burst(at, 0.02, 'bandpass', 2600, 0.9, 0.5, 0.004)
      ring(at, [[1450, 14, 0.12], [3100, 9, 0.07]], 0.008)
      thump(at, 115, 46, 0.075, 0.55)
      burst(at + 0.055, 0.008, 'bandpass', 4200, 1.5, 0.18, 0.002)
      for (let k = 0; k < 3; k++) burst(at + 0.075 + k * (0.012 + Math.random() * 0.012), 0.005, 'bandpass', 1800, 2, 0.04, 0.0015)
      const s = source(bank.white, true), f = filter('bandpass', 380, 0.8), g = gain(0)
      g.gain.setValueAtTime(0, at + 0.03)
      g.gain.linearRampToValueAtTime(0.03, at + 0.22)
      g.gain.setTargetAtTime(0.004, at + 0.3, 0.25)
      g.gain.setTargetAtTime(0, at + 1.2, 0.5)
      s.connect(f)
      f.connect(g)
      g.connect(fx)
      play(s, at, at + 3.5)
    }
    /** STOP: crisp, and a little hollow, like the inside of a cassette deck. */
    function snap(at) {
      burst(at, 0.006, 'highpass', 2200, 0.7, 0.75, 0.0012)
      const s = source(bank.white), e = gain(0), comb = ctx.createDelay(0.05), fb = gain(0.74), band = filter('bandpass', 980, 0.9), o = gain(0)
      comb.delayTime.value = 0.0021
      e.gain.setValueAtTime(1, at)
      e.gain.setTargetAtTime(0, at, 0.003)
      o.gain.setValueAtTime(0.32, at)
      o.gain.setTargetAtTime(0, at + 0.02, 0.05)
      s.connect(e)
      e.connect(comb)
      comb.connect(fb)
      fb.connect(comb)
      comb.connect(band)
      band.connect(o)
      o.connect(fx)
      play(s, at, at + 0.03, Math.random() * 0.9)
      thump(at, 150, 62, 0.045, 0.4)
      burst(at + 0.036, 0.004, 'bandpass', 3400, 1.2, 0.16, 0.0012)
    }

    // ---- the music, a beat at a time (sixty a minute), scheduled a little ahead
    let first = null, beatN = 0, popAt = 0, turnAt = 0
    function beat(i, t) {
      const bar = Math.floor(i / 4), b = i % 4, chord = CHORDS[bar % 4]
      const cycle = Math.floor(i / 16), pos = i % 16
      const swell = Math.min(1, 0.62 + bar * 0.1) // the first bars come in softly
      const j = () => (Math.random() - 0.5) * 0.024 // a hand is never quite on time
      if (b === 0) {
        bass(t + 0.01, chord.bass, 3.95, swell)
        pad(t, chord.pad, 3.9, swell)
        chord.keys.forEach((m, k) => keys(t + 0.02 + k * (0.042 + Math.random() * 0.02), m, (0.44 + Math.random() * 0.1) * swell, 4.2))
      } else if (b === 2) {
        chord.keys.slice(2).forEach((m, k) => keys(t + 0.5 + k * 0.05 + j(), m, (0.2 + Math.random() * 0.06) * swell, 2.6))
      }
      const phrase = cycle > 0 ? PHRASES[(cycle - 1) % PHRASES.length] : null
      if (phrase) for (const [at, m] of phrase) if (at >= pos && at < pos + 1 && Math.random() > 0.08) keys(t + (at - pos) + j(), m, 0.3 + Math.random() * 0.08, 3.4)
    }
    function pop(at, amp, hp) {
      const s = source(bank.pops[(Math.random() * bank.pops.length) | 0]), f = filter('highpass', hp, 0.8), g = gain(amp)
      s.connect(f)
      f.connect(g)
      const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null
      if (p) {
        p.pan.value = Math.random() * 1.6 - 0.8
        g.connect(p)
        p.connect(popBus)
      } else g.connect(popBus)
      play(s, at)
    }

    return {
      /** The press: the clunk now, the tape coming up to speed, the hiss rising, the music on the first beat. */
      start(at) {
        for (const o of [...warble.map((w) => w.o), wow, flut, tremLfo, panLfo, padLfo, vib, rpm, drag]) play(o, at)
        play(hissSrc, at, null, Math.random() * 5)
        play(rumble, at, null, Math.random() * 3)
        clunk(at)
        drag.offset.setValueAtTime(-140, at + 0.08)
        drag.offset.setTargetAtTime(0, at + 0.12, 0.22)
        hissG.gain.setValueAtTime(0, at + 0.1)
        hissG.gain.linearRampToValueAtTime(HISS, at + 2.6)
        rpmD.gain.setValueAtTime(0, at + 0.1)
        rpmD.gain.linearRampToValueAtTime(HISS * 0.16, at + 2.6)
        rumbleG.gain.setValueAtTime(0, at + 0.1)
        rumbleG.gain.linearRampToValueAtTime(0.05, at + 2.6)
        popBus.gain.setValueAtTime(0, at + 0.2)
        popBus.gain.linearRampToValueAtTime(1, at + 1.8)
        first = at + FIRST_BEAT
        popAt = at + 0.2
        turnAt = at + 1.1
      },
      hall(ir) { if (!verb.buffer) verb.buffer = ir },
      tick(horizon) {
        if (first == null) return
        while (first + beatN < horizon) { beat(beatN, first + beatN); beatN++ }
        while (popAt < horizon) {
          popAt += -Math.log(1 - Math.random()) / 11 // about eleven a second, at random
          const r = Math.random()
          const amp = r < 0.92 ? 0.004 + Math.random() * 0.012 : r < 0.995 ? 0.02 + Math.random() * 0.035 : 0.07 + Math.random() * 0.05
          pop(popAt, amp, amp > 0.02 ? 900 + Math.random() * 1600 : 2400 + Math.random() * 4000)
        }
        // a nick in the groove that comes round with every turn of the record
        while (turnAt < horizon) { pop(turnAt, 0.025 + Math.random() * 0.012, 1300); turnAt += 1.8 }
      },
      /** decayFactor 0 → 1: muffled, warbling, dragging flat, further away. Returns a dropout's length, if one starts. */
      decay(d, at) {
        if (at == null) at = ctx.currentTime
        tone.frequency.setTargetAtTime(5200 * Math.pow(240 / 5200, Math.pow(d, 0.8)), at, 0.12)
        warble[0].d.gain.setTargetAtTime(3 + 52 * d, at, 0.3)
        warble[1].d.gain.setTargetAtTime(1.5 + 28 * d * d, at, 0.3)
        drag.offset.setTargetAtTime(-80 * d * d, at, 0.9)
        wowD.gain.setTargetAtTime(0.0011 + 0.0068 * d, at, 0.3)
        flutD.gain.setTargetAtTime(0.00007 + 0.0005 * d, at, 0.3)
        musicOut.gain.setTargetAtTime(0.95 - 0.42 * d, at, 0.25)
        hissG.gain.setTargetAtTime(HISS * (1 + 0.7 * d), at, 0.4)
        if (d > 0.3 && at > this._dropUntil && Math.random() < (d - 0.3) * 0.12) {
          const len = 0.05 + Math.random() * 0.17, depth = 0.25 + Math.random() * 0.4
          drop.gain.setValueAtTime(1, at)
          drop.gain.linearRampToValueAtTime(depth, at + 0.02)
          drop.gain.setValueAtTime(depth, at + 0.02 + len)
          drop.gain.linearRampToValueAtTime(1, at + 0.08 + len)
          this._dropUntil = at + 0.15 + len
          return len
        }
        return 0
      },
      _dropUntil: 0,
      /** No fade: the music and the crackle are simply gone. */
      cut(at) {
        for (const g of [musicOut, crackle]) {
          g.gain.cancelScheduledValues(at)
          g.gain.setValueAtTime(0, at)
        }
      },
      snap,
      dispose() {
        for (const s of live) try { s.stop() } catch (e) {}
        live.clear()
        try { master.disconnect() } catch (e) {}
      },
    }
  }
  /*</engine>*/

  const sound = {
    ctx: null,
    bank: null,
    ir: null,
    engine: null,
    pump: 0,
    rest: 0,
    retiring: null,
    wake() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext
        if (!AC) return null
        try { this.ctx = new AC({ latencyHint: 'interactive' }) } catch (e) {
          try { this.ctx = new AC() } catch (e2) { return null }
        }
      }
      clearTimeout(this.rest)
      if (this.retiring) { this.retiring.dispose(); this.retiring = null }
      if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {})
      return this.ctx
    },
    start() {
      const ctx = this.wake()
      if (!ctx) return
      if (!this.bank) this.bank = prebaked || bake((c, n, r) => ctx.createBuffer(c, n, r), ctx.sampleRate)
      const engine = Engine(ctx, this.bank, ctx.destination)
      this.engine = engine
      const at = ctx.currentTime + 0.01
      engine.start(at)
      engine.tick(at + 0.6)
      clearInterval(this.pump)
      this.pump = setInterval(() => engine.tick(ctx.currentTime + 0.45), 60)
      if (this.ir) engine.hall(this.ir)
      else setTimeout(() => { this.ir = this.ir || hall(ctx); engine.hall(this.ir) }, 0) // (made just after the clunk, not before it)
    },
    decay(d) { return this.engine ? this.engine.decay(d) : 0 },
    snap() { this.stop(true) },
    silence() { this.stop(false) },
    stop(withSnap) {
      const e = this.engine
      if (!e) return
      this.engine = null
      clearInterval(this.pump)
      const at = this.ctx.currentTime
      e.cut(at)
      if (withSnap) e.snap(at)
      this.retiring = e
      this.rest = setTimeout(() => {
        e.dispose()
        this.retiring = null
        this.ctx.suspend().catch(() => {}) // and then: nothing at all
      }, withSnap ? 700 : 150)
    },
  }

  // the noise, made while nobody is holding anything yet (so the first press is instant)
  let prebaked = null
  setTimeout(() => {
    try {
      if (typeof AudioBuffer === 'function') prebaked = bake((c, n, r) => new AudioBuffer({ numberOfChannels: c, length: n, sampleRate: r }), 48000)
    } catch (e) {
      prebaked = null
    }
  }, 400)

  // ═════════════════════ Every frame
  let last = performance.now()
  function frame() {
    const now = performance.now()
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000))
    last = now
    if (state === 'holding') hold(now, dt)
    else if (state === 'dormant' || state === 'resetting') {
      light.target.i = 0
      light.target.r *= 0.98
    }
    if (state !== 'dark' && state !== 'after') light.draw(now, dt)
    if (state !== 'dark') grain.draw(now)
    requestAnimationFrame(frame)
  }

  layout()
  window.addEventListener('resize', layout)
  if (state === 'after') {
    btn.remove()
    aftermath()
  }
  requestAnimationFrame(frame)
})()
</script>
</body>
</html>
